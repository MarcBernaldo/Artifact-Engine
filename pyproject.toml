[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artifact-engine"
version = "0.7.80"
description = "Modular DFIR triage engine: decompress acquisitions (KAPE/UAC) and parse forensic artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }   # PolyForm-Noncommercial-1.0.0 (source-available; not OSI open-source)
authors = [{ name = "Marc Bernaldo", email = "marcbt96@gmail.com" }]
# Every requirement carries an UPPER bound, and `test_every_dependency_declares_an
# _upper_bound` keeps it that way. The reason is v0.7.76: `pysigma-backend-sqlite`
# was open-ended, its 2.0.0 changed what the generated SQL names, and a fresh
# install silently produced a run with no Sigma detection at all -- the failure
# mode this project can least afford, since an empty findings table reads exactly
# like a clean host. A cap turns "whoever installs next decides" into "adopted on
# purpose, with the suite as the evidence". Each cap is the next major above the
# newest release the suite has been run against (2026-09-29: pydantic 2.13.5,
# PyYAML 6.0.3, requests 2.34.2, pandas 3.0.6, XlsxWriter 3.2.9, python-registry
# 1.3.1, pySigma 1.5.1 + backend 2.0.0, maxminddb 3.2.0, yara-python 4.5.4,
# cryptography 50.0.1, pytest 9.1.1, openpyxl 3.1.5, py7zr 1.1.3).
#
# `build-system.requires` is deliberately NOT capped: a build backend that breaks
# fails loudly at install time, which is the opposite of the failure above.
dependencies = [
    "pydantic>=2.5,<3",
    "PyYAML>=6.0,<7",
    "requests>=2.28,<3",
    "pandas>=2.0,<4",
    "XlsxWriter>=3.1,<4",
    "python-registry>=1.3,<2",
    "pysigma>=1.4,<2",
    # <3: 2.0.0 renamed the table placeholder this module substitutes (see
    # core/sigma_engine._retable) and every rule silently read from a table no
    # case has. The code handles 1.x and 2.x; a THIRD major is adopted on
    # purpose, with the suite as the evidence, not by whoever installs next.
    "pysigma-backend-sqlite>=0.1.1,<3",
    "maxminddb>=2.2,<4",
    "yara-python>=4.3,<5",
    "cryptography>=41.0,<51",
]

[project.optional-dependencies]
# openpyxl is test-only: XlsxWriter WRITES the .xlsx, and the tests that check what
# landed in one need a reader. It was inherited from another package's dependencies
# until a clean environment showed five tests failing on the import.
# py7zr likewise: the engine runs without it (7-Zip does the work), but the native
# .7z path is only tested where it is installed.
dev = ["pytest>=7,<10", "ruff>=0.16,<0.17", "openpyxl>=3.1,<4", "py7zr>=0.20,<2"]

[project.scripts]
artifact-engine = "artifact_engine.cli:main"
aeng = "artifact_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
artifact_engine = ["data/**/*.yaml", "data/**/*.yml", "data/**/*.txt", "data/**/*.reb", "data/**/*.json", "data/**/*.yar", "data/sigma/VERSION"]

[tool.pytest.ini_options]
# Collect ONLY the engine's own suite. `aeng setup` downloads chainsaw into
# `src/artifact_engine/tools/`, and that release ships SigmaHQ's own rule-lint
# tests -- a bare `pytest` from the repo root collected and ran 14 of them. So the
# gate's size and colour depended on which chainsaw release had last been fetched
# into a gitignored directory: 655 tests on a machine that had run `aeng setup`,
# 641 on a clean checkout and in CI, with the difference invisible in the output.
# Third-party rules are not this project's gate.
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# The rule SET is ruff's own default, which is why `dev` pins a ruff MINOR range:
# the default moved between versions and the same unchanged tree reported 126
# findings on one and 75 on the next, so "ruff check is clean" only means
# something when everyone runs the same range. Widening `select` explicitly is a
# separate decision with a real cost -- measured, `E` alone adds 62 line-length
# violations and the full families 310 findings.
ignore = [
    # Best-effort parsing over evidence, not application code. A corrupt record,
    # a hive key that is not there, a process already gone: the handler moves to
    # the next one BY DESIGN, and logging each would bury the run log in noise
    # that means nothing to the analyst. Where the failure is worth reporting the
    # code already logs it; these are the paths where it is not.
    "S110",   # try-except-pass
    "S112",   # try-except-continue
]
# `line-length` above was declared from the start but never checked -- E501 is not
# in ruff's default set, so the 110 was decorative. Turned on here so it means
# something.
extend-select = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The report generators emit HTML/CSS/JS as literal strings, and that is why their
# lines are long: 42 of the 56 over the limit carry markup. Re-wrapping those is
# not formatting -- it edits the text that becomes the page the analyst opens, a
# split inside a tag or a CSS declaration changes the output, and no test would
# catch it. The limit is enforced everywhere else.
"src/artifact_engine/handlers/_web_report.py" = ["E501"]
"src/artifact_engine/core/lateral_report.py" = ["E501"]
# The suite reads differently from the engine: a
# fixture line IS the data, so wrapping it hides the shape being tested; `list(x)[0]`
# says "the only one" more plainly than `next(iter(x))` in an assertion; a naive
# datetime is frequently the thing under test, not an oversight; and a multi-line
# string inside a list literal is usually a deliberate block of sample evidence.
# Turning on E501 for the engine swept these in by accident -- they were never
# findings. Everything that catches real defects still applies here.
"tests/*" = ["E501", "RUF015", "ISC004", "DTZ001", "FLY002"]
