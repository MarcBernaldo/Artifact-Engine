# Parsers removed from the engine with no successor. What each one left in a case
# parsed before its removal -- its tables, its .done marker and its records -- is
# removed on the next run (core/retired.py), so the consolidation stops loading a
# table nothing produces any more. A renamed parser does not go here: its
# successor names it under `replaces:` instead.
#
#   <id>: {os, category, outputs: [names or globs, relative to its category folder]}

# 18,009 rows on a 9-host KAPE case, 17,320 of them flagged: copied files, zeroed
# sub-seconds and a record change after the write are ordinary on NTFS.
timestomp_mft:
  os: windows
  category: filesystem
  outputs: ["timestomp.csv"]

# ctime after mtime is what every package installation leaves on Linux.
timestomp_bodyfile:
  os: linux
  category: filesystem
  outputs: ["timestomp.csv"]

# 4,630 of 4,692 rows flagged `unusual_path` on 7 UAC hosts.
suid_sgid:
  os: linux
  category: systeminfo
  outputs: ["suid_sgid.csv"]

# Its name before v0.7.158, retired then by suid_sgid: a case parsed before that
# release and not since still holds its table.
suid:
  os: linux
  category: systeminfo
  outputs: ["suid.csv"]

# A second engine over the event logs hayabusa already reads: its 55,609 rows on
# the same case were ordinary logon, RDP and PowerShell events, or covered by
# task_installs / service_installs / defender_detections / evtx_application.
chainsaw_sigma:
  os: windows
  category: eventlogs
  outputs: ["chainsaw_*.csv"]

# Not a parser: the table web_metrics stopped writing in v0.7.161. Its own next
# run removes it where it has a record of writing it (v0.7.106 on); this entry
# covers a case parsed before that, or a copy re-saved from Excel.
web_404_paths:
  os: linux
  category: web
  outputs: ["web_404_paths.csv"]

# 62 rows on 7 UAC hosts and 49 on 9 KAPE hosts, a third of them flagged; not
# what the investigations here look for (user, 2026-10-18).
ransomware_mft:
  os: windows
  category: detections
  outputs: ["ransomware_traces.csv"]

ransomware_bodyfile:
  os: linux
  category: detections
  outputs: ["ransomware_traces.csv"]

# One table per user and hive, named after the account: hundreds of tables on a
# server (and the account names in the schema), noise for the cases here.
reg_shellbags:
  os: windows
  category: shellbags
  outputs: ["shellbags_*.csv"]

# 116 rows on 9 KAPE hosts, 114 of them `misplaced` (one credential file outside
# its place: backups, copied profiles), 85 flagged (user, 2026-10-18).
credential_access:
  os: windows
  category: detections
  outputs: ["credential_access.csv"]

# Not a parser: hayabusa's logon-summary views, no longer run (v0.7.161).
hayabusa_logon_summary:
  os: windows
  category: eventlogs
  outputs: ["hayabusa_logon*.csv"]

# Not a parser: the table web_metrics stopped writing in v0.7.161.
web_auth_fail:
  os: linux
  category: web
  outputs: ["web_auth_fail.csv"]

# v0.7.162: process_network is the host's process table, each process with the
# sockets it holds. The `ps` list and the socket list it joined are not written
# again; hidden_pids was UAC's raw list, which process_anomalies filters.
processes:
  os: linux
  category: processes
  outputs: ["processes.csv", "hidden_pids.csv"]

network_connections:
  os: linux
  category: network
  outputs: ["network_connections.csv"]

# Its name before v0.7.158, retired then by network_connections: a case parsed
# before that release and not since still holds its table.
network:
  os: linux
  category: network
  outputs: ["network_connections.csv"]

# v0.7.162: one `logins` table holds every login record -- wtmp, btmp, last/lastb
# where the binary gave nothing, lastlog -- with a `source` column.
wtmp:
  os: linux
  category: eventlogs
  outputs: ["wtmp.csv"]

btmp:
  os: linux
  category: eventlogs
  outputs: ["btmp.csv"]

# Not a parser: the table `logins` stopped writing in v0.7.162 (its rows are in
# logins.csv now, source `lastlog`).
lastlog:
  os: linux
  category: eventlogs
  outputs: ["lastlog.csv"]
