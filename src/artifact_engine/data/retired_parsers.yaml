# Parsers removed from the engine with no successor. What each one left in a case
# parsed before its removal -- its tables, its .done marker and its records -- is
# removed on the next run (core/retired.py), so the consolidation stops loading a
# table nothing produces any more. A renamed parser does not go here: its
# successor names it under `replaces:` instead -- unless the successor writes to
# another category folder, which `replaces:` does not reach (cron_jobs below).
#
#   <id>: {os, category, outputs: [names or globs, relative to its category folder]}

# 18,009 rows on a 9-host KAPE case, 17,320 of them flagged: copied files, zeroed
# sub-seconds and a record change after the write are ordinary on NTFS.
timestomp_mft:
  os: windows
  category: filesystem
  outputs: ["timestomp.csv"]

# ctime after mtime is what every package installation leaves on Linux.
timestomp_bodyfile:
  os: linux
  category: filesystem
  outputs: ["timestomp.csv"]

# 4,630 of 4,692 rows flagged `unusual_path` on 7 UAC hosts.
suid_sgid:
  os: linux
  category: systeminfo
  outputs: ["suid_sgid.csv"]

# Its name before v0.7.158, retired then by suid_sgid: a case parsed before that
# release and not since still holds its table.
suid:
  os: linux
  category: systeminfo
  outputs: ["suid.csv"]

# A second engine over the event logs hayabusa already reads: its 55,609 rows on
# the same case were ordinary logon, RDP and PowerShell events, or covered by
# task_installs / service_installs / defender_detections / evtx_application.
chainsaw_sigma:
  os: windows
  category: eventlogs
  outputs: ["chainsaw_*.csv"]

# Not a parser: the table web_metrics stopped writing in v0.7.161. Its own next
# run removes it where it has a record of writing it (v0.7.106 on); this entry
# covers a case parsed before that, or a copy re-saved from Excel.
web_404_paths:
  os: linux
  category: web
  outputs: ["web_404_paths.csv"]

# 62 rows on 7 UAC hosts and 49 on 9 KAPE hosts, a third of them flagged; not
# what the investigations here look for (user, 2026-10-18).
ransomware_mft:
  os: windows
  category: detections
  outputs: ["ransomware_traces.csv"]

ransomware_bodyfile:
  os: linux
  category: detections
  outputs: ["ransomware_traces.csv"]

# One table per user and hive, named after the account: hundreds of tables on a
# server (and the account names in the schema), noise for the cases here.
reg_shellbags:
  os: windows
  category: shellbags
  outputs: ["shellbags_*.csv"]

# 116 rows on 9 KAPE hosts, 114 of them `misplaced` (one credential file outside
# its place: backups, copied profiles), 85 flagged (user, 2026-10-18).
credential_access:
  os: windows
  category: detections
  outputs: ["credential_access.csv"]

# Not a parser: hayabusa's logon-summary views, no longer run (v0.7.161).
hayabusa_logon_summary:
  os: windows
  category: eventlogs
  outputs: ["hayabusa_logon*.csv"]

# Not a parser: the table web_metrics stopped writing in v0.7.161.
web_auth_fail:
  os: linux
  category: web
  outputs: ["web_auth_fail.csv"]

# v0.7.162: process_network is the host's process table, each process with the
# sockets it holds. The `ps` list and the socket list it joined are not written
# again; hidden_pids was UAC's raw list, which process_anomalies filters.
processes:
  os: linux
  category: processes
  outputs: ["processes.csv", "hidden_pids.csv"]

network_connections:
  os: linux
  category: network
  outputs: ["network_connections.csv"]

# Its name before v0.7.158, retired then by network_connections: a case parsed
# before that release and not since still holds its table.
network:
  os: linux
  category: network
  outputs: ["network_connections.csv"]

# v0.7.162: one `logins` table holds every login record -- wtmp, btmp, last/lastb
# where the binary gave nothing, lastlog -- with a `source` column.
wtmp:
  os: linux
  category: eventlogs
  outputs: ["wtmp.csv"]

btmp:
  os: linux
  category: eventlogs
  outputs: ["btmp.csv"]

# Not a parser: the table `logins` stopped writing in v0.7.162 (its rows are in
# logins.csv now, source `lastlog`).
lastlog:
  os: linux
  category: eventlogs
  outputs: ["lastlog.csv"]

# v0.7.162: the journal's entries are rows of syslog.csv (source `journal`), the
# ones rsyslog already wrote to a text file left out.
journal:
  os: linux
  category: eventlogs
  outputs: ["journal.csv"]

# Folded into `tasks` (lin_tasks, v0.7.168) with the timers and at jobs, under
# persistence: a successor in another category folder cannot retire them through
# `replaces:`, which only looks in its own. `cron` is its name before v0.7.158.
cron_jobs:
  os: linux
  category: execution
  outputs: ["cron_jobs.csv"]

cron:
  os: linux
  category: execution
  outputs: ["cron.csv"]

# v0.7.170: the web alert is web_sigma. web_hunt was a second engine over the same
# requests (SQLi 3,168 rows against Sigma's 1,229 on one case); the analyst's
# web_suspicious.txt indicators are rows of web_sigma now. `huntweb` is its name
# before v0.7.158.
web_hunt:
  os: linux
  category: web
  outputs: ["web_hunt.csv"]

huntweb:
  os: linux
  category: web
  outputs: ["huntweb.csv"]

# Not a parser: the table web_metrics stopped writing in v0.7.170 (its rows are the
# IP table of web_metrics.html). 4,863 flagged on one case, 707k rows on another.
web_ip_stats:
  os: linux
  category: web
  outputs: ["web_ip_stats.csv"]

# v0.7.170: the `alerts_*` tables restated rows of other tables in a common shape
# (alerts_bodyfile copied all 14,007 bodyfile timestamps rows on one host, 16,005
# of 16,464 rated low). The front page reads every table's own flags and
# severities, so the groups only repeated them.
alert_groups:
  os: windows
  category: detections
  outputs: ["alerts_mft.csv", "alerts_execution.csv", "alerts_shell.csv"]

alert_groups_linux:
  os: linux
  category: detections
  outputs: ["alerts_bodyfile.csv", "alerts_shell.csv"]

# Not parsers: the tables exec_hunt and cmd_hunt wrote until v0.7.171, when every
# table took art_/alert_ and these two kept their ids. Their own next run removes
# the old names where it has a record of writing them; these entries cover a case
# parsed before v0.7.106, or a table re-saved from Excel.
exec_hunt_tables:
  os: windows
  category: detections
  outputs: ["rmm.csv", "lolbas.csv", "byovd.csv", "suspicious_tools.csv"]

cmd_hunt_tables:
  os: windows
  category: detections
  outputs: ["exfil_commands.csv", "suspicious_commands.csv"]
