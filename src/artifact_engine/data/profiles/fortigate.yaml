id: fortigate
description: "A FortiGate/FortiOS log export (syslog or FortiAnalyzer CSV) dropped in a fortigate[-label] folder at the case root. The folder becomes a machine with a flagged firewall timeline in its own .db and .xlsx."
os: linux
collector: fortigate
detect:
  all_of:
    - dir_name: "fortigate(\\d+|[-_].+)?"
    - glob: "**/*"        # at least one entry: an empty drop folder is not a machine
machine_name:
  strategy: dir_name
