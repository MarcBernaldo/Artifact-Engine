id: weblogs
description: "Web-server access logs dropped loose in a weblogs[-label] folder at the case root. The folder becomes a machine: the web parsers read every file in it and write to its own .db and .xlsx."
os: linux
collector: weblogs
detect:
  all_of:
    - dir_name: "weblogs(\\d+|[-_].+)?"
    - glob: "**/*"        # at least one entry: an empty drop folder is not a machine
machine_name:
  strategy: dir_name
