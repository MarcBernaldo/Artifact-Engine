id: windows_memory
description: "A Windows memory image (.raw, .mem, .vmem, .lime of 64 MiB or more; .dmp of 256 MiB or more) in the top two levels of the case, unless recognised as Linux. A sibling <stem>_memory/ folder points to the image and is the machine; Volatility 3 runs one plugin per parser, and the unit is renamed after the COMPUTERNAME it holds. The image is never moved or copied."
os: windows
collector: memory
detect:
  all_of:
    - exists: "memory.image"   # written by core/memory.stage_images, never by hand
machine_name:
  # The image's stem until phase 3 has read the processes' environment; then the
  # host's own name (core/memory.name_memory_units).
  strategy: file
  file: "memory.name"
  fallback: dir_name
