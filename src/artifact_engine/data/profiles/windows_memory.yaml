id: windows_memory
description: "A Windows memory image (.raw/.mem/.vmem/.lime of 64 MB or more, .dmp of 256 MB or more) anywhere in the top two levels of the case -- or one whose kernel is unknown; an image recorded as Linux (memory.linux) is taken first by linux_memory. Each image gets a sibling folder `<stem>_memory/` holding a pointer to it, and that folder is the machine: Volatility 3 runs one plugin per parser over the image, the tables land in the folder's own .db/.xlsx, and once the processes' environment has been read the unit is named after the host it names (COMPUTERNAME). The image itself is never moved or copied."
os: windows
collector: memory
detect:
  all_of:
    - exists: "memory.image"   # written by core/memory.stage_images, never by hand
machine_name:
  # The image's stem until phase 3 has read the processes' environment; then the
  # host's own name (core/memory.name_memory_units).
  strategy: file
  file: "memory.name"
  fallback: dir_name
