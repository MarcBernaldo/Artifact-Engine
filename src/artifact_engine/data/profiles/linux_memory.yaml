id: linux_memory
description: "A Linux memory image (.raw, .mem, .vmem, .lime of 64 MiB or more; .dmp of 256 MiB or more) in the top two levels of the case, recognised by its kernel banner. A sibling <stem>_memory/ folder points to the image and is the machine; Volatility 3 runs one Linux plugin per parser with symbols from the public ISF index. The image is never moved or copied."
os: linux
collector: memory
detect:
  # Checked before windows_memory (profiles load in file-name order), which
  # matches the pointer alone.
  all_of:
    - exists: "memory.image"   # written by core/memory.stage_images, never by hand
    - exists: "memory.linux"   # written by core/memory_os.classify
machine_name:
  # The image's stem until phase 3 has read the processes' environment; then the
  # host they name (core/memory_os.name_linux_units).
  strategy: file
  file: "memory.name"
  fallback: dir_name
