id: cmd_hunt
name: "Command-line hunt (LOLExfil, suspicious tools)"
description: "Every command line the host kept (PowerShell console history, live-response processes, scheduled tasks, service ImagePaths, PowerShell 400/800, 4104 script blocks and 4103 pipelines, Sysmon 1), deduplicated and matched against two catalogues. alert_exfil_commands: LOLExfil endpoint patterns, level high for exfiltration, medium for staging, low for the tool running; fields level, tool, detect_type, purpose, source, user, command_line, first_seen_utc, last_seen_utc, count, pattern. alert_suspicious_commands: suspicious_tools.txt categories; fields category, source, user, command_line, first_seen_utc, last_seen_utc, count, known_benign."
source: "ConsoleHost_history.txt, LiveResponse Pslist, tasks, services, PowerShell and Sysmon event logs"
kind: alert
os: windows
category: detections
depends_on: ["art_tasks", "art_reg_services", "art_evtx_powershell", "art_evtx_powershell_scripts", "art_evtx_sysmon"]
provides: [exfil_commands_csv, suspicious_commands_csv]
handler: "artifact_engine.handlers.win_cmd_hunt:run"
outputs:
  - path: "{out}/alert_exfil_commands.csv"
  - path: "{out}/alert_suspicious_commands.csv"
