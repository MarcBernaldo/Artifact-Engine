id: mem_hivelist
name: "Memory: hivelist (Volatility 3)"
description: "Registry hives loaded in memory and the file each was loaded from. Volatility 3 `windows.registry.hivelist.HiveList` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["mem_info"]
handler: "artifact_engine.handlers.mem_volatility:hivelist"
timeout: 3600
