id: art_mem_dlllist
name: "Memory: dlllist (Volatility 3)"
description: "Modules loaded by every process, with path, base and load time. Volatility 3 `windows.dlllist.DllList` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:dlllist"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  mem_dlllist: ["mem_dlllist.csv"]
