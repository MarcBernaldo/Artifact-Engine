id: alert_groups
name: "Alerts by artifact"
description: "The detections that read one artifact, gathered in one table per artifact with a common shape (alert, severity, subject, time_utc, detail, source_table): alerts_mft (credential stores, collection staging), alerts_execution (BYOVD drivers, relocated LOLBAS, RMM and tunnel tools, from every execution artifact) and alerts_shell (suspicious and exfiltration command lines from every source cmd_hunt reads). The source tables are untouched."
source: "The detection tables of this machine"
alert: flag
os: windows
category: detections
depends_on: ["credential_access", "collection_artifacts_mft",
             "exec_hunt", "cmd_hunt"]
handler: "artifact_engine.handlers.win_alert_groups:run"
