id: art_mem_ssdt
name: "Memory: ssdt (Volatility 3)"
description: "System service descriptor table: the module each system call resolves to (a hook points outside ntoskrnl/win32k). Volatility 3 `windows.ssdt.SSDT` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:ssdt"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  mem_ssdt: ["mem_ssdt.csv"]
