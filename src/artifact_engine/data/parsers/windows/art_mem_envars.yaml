id: art_mem_envars
name: "Memory: envars (Volatility 3)"
description: "Environment variables of every process (COMPUTERNAME, USERNAME, PATH, temp folders); names the unit after its host. Volatility 3 `windows.envars.Envars` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:envars"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  mem_envars: ["mem_envars.csv"]
