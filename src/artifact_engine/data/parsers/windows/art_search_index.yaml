id: art_search_index
name: "Windows Search index"
description: "Windows Search index (Windows.edb or Windows.db): indexed file metadata and URLs, deleted entries included. SIDR."
source: "Windows Search (Windows.edb / .db)"
kind: artifact
os: windows
category: search
short: art_search   # SIDR writes multiple report CSVs; short prefixes them -> search_<report>
requires: ["ProgramData/Microsoft/Search/Data/Applications/Windows"]
provides: [search_index_csv]
# SIDR on the database as collected; on a torn page, on a repaired copy
handler: "artifact_engine.handlers.win_search_index:run"
tool:
  binary: sidr.exe
  source:
    repo: strozfriedberg/sidr
    asset: sidr.exe
timeout: 1800
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  search_index: []
