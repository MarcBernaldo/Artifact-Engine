id: art_search_index
name: "Windows Search index"
description: "Windows.edb / Windows.db (file metadata + URLs, incl. deleted) via SIDR"
source: "Windows Search (Windows.edb / .db)"
alert: context
os: windows
category: search
short: art_search   # SIDR writes multiple report CSVs; short prefixes them -> search_<report>
requires: ["ProgramData/Microsoft/Search/Data/Applications/Windows"]
provides: [search_index_csv]
tool:
  binary: sidr.exe
  source:
    repo: strozfriedberg/sidr
    asset: sidr.exe
command:
  - "{binary}"
  - "-f"
  - "csv"
  - "-r"
  - "to-file"
  - "-o"
  - "{out}"
  - "{evidence}/ProgramData/Microsoft/Search/Data/Applications/Windows"
timeout: 1800
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  search_index: []
