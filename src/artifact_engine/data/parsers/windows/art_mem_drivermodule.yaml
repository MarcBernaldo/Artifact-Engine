id: art_mem_drivermodule
name: "Memory: drivermodule (Volatility 3)"
description: "Driver objects with no module behind them: the shape a rootkit driver leaves. Volatility 3 `windows.malware.drivermodule.DriverModule` over the unit's memory image."
source: "Memory image"
alert: detect
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:drivermodule"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  mem_drivermodule: ["mem_drivermodule.csv"]
