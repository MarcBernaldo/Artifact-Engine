id: art_evtx_system
name: "EVTX: System"
description: "System log events"
source: "System.evtx"
alert: context
os: windows
category: eventlogs
requires: ["Windows/System32/winevt/Logs/System.evtx"]
provides: [evtx_system_csv]
tool:
  binary: EvtxECmd/EvtxECmd.exe
  source:
    url: "https://download.ericzimmermanstools.com/net9/EvtxECmd.zip"
    unpack: true
command:
  - "{binary}"
  - "-f"
  - "{evidence}/Windows/System32/winevt/Logs/System.evtx"
  - "--csv"
  - "{out}"
  - "--csvf"
  - "art_evtx_system.csv"
timeout: 1200
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  evtx_system: ["evtx_system.csv"]
