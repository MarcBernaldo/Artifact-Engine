id: evtx_smbclient_sec
name: "EVTX: SMB client security"
description: "SMB client security channel (share access denials, signing and encryption failures). Read by smb_client."
os: windows
category: eventlogs
requires: ["Windows/System32/winevt/Logs/Microsoft-Windows-SMBClient%4Security.evtx"]
provides: [evtx_smbclient_sec_csv]
tool:
  binary: EvtxECmd/EvtxECmd.exe
  source:
    url: "https://download.ericzimmermanstools.com/net9/EvtxECmd.zip"
    unpack: true
command:
  - "{binary}"
  - "-f"
  - "{evidence}/Windows/System32/winevt/Logs/Microsoft-Windows-SMBClient%4Security.evtx"
  - "--csv"
  - "{out}"
  - "--csvf"
  - "evtx_smbclient_sec.csv"
timeout: 600
