id: art_evtx_application
name: "EVTX: Application"
description: "Application log events"
source: "Application.evtx"
alert: context
os: windows
category: eventlogs
requires: ["Windows/System32/winevt/Logs/Application.evtx"]
provides: [evtx_application_csv]
tool:
  binary: EvtxECmd/EvtxECmd.exe
  source:
    url: "https://download.ericzimmermanstools.com/net9/EvtxECmd.zip"
    unpack: true
command:
  - "{binary}"
  - "-f"
  - "{evidence}/Windows/System32/winevt/Logs/Application.evtx"
  - "--csv"
  - "{out}"
  - "--csvf"
  - "art_evtx_application.csv"
timeout: 1200
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  evtx_application: ["evtx_application.csv"]
