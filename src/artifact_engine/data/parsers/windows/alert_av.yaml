id: alert_av
name: "Third-party AV / EDR detections"
description: "Detections from third-party antivirus and EDR log directories listed in assets/av_products.txt. A line whose layout cannot be confirmed keeps only its time and raw text. Flags detections the product left in place (not removed, access denied, delete failed). Fields: product, timestamp_local, timestamp_kind, threat_name, path, action, user, source_file, detail, suspicious. Also writes art_av_products, every product directory found and how much was read."
source: "assets/av_products.txt (product log dirs under ProgramData, Program Files, per-user AppData)"
kind: alert
os: windows
category: detections
handler: "artifact_engine.handlers.win_av:run"
provides: [av_detections_csv, av_products_csv]
outputs:
  - path: "{out}/alert_av.csv"
    format: csv
  - path: "{out}/art_av_products.csv"
    format: csv
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  av_detections: ["av_detections.csv", "av_products.csv"]
