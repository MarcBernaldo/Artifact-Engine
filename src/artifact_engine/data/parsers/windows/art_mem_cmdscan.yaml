id: art_mem_cmdscan
name: "Memory: cmdscan (Volatility 3)"
description: "Command history buffers of conhost: commands typed at a console, including closed windows. Volatility 3 `windows.cmdscan.CmdScan` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:cmdscan"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  mem_cmdscan: ["mem_cmdscan.csv"]
