id: art_jumplist
name: "Jump Lists"
description: "Automatic/Custom Destinations (recent files & apps) - JLECmd"
source: "User profiles (AutomaticDestinations/CustomDestinations)"
alert: context
os: windows
category: filesystem
short: art_jumplist   # JLECmd writes _AutomaticDestinations/_CustomDestinations; short prefixes them
subtypes:   # the tool's names, kept within Excel's 31 characters
  AutomaticDestinations: automatic
  CustomDestinations: custom
requires: ["Users"]
provides: [jumplists_csv]
tool:
  binary: JLECmd.exe
  source:
    url: "https://download.ericzimmermanstools.com/net9/JLECmd.zip"
    unpack: true
command:
  - "{binary}"
  - "-d"
  - "{evidence}/Users"
  - "-q"
  - "--csv"
  - "{out}"
timeout: 900
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  jumplists: ["jumplist_AutomaticDestinations.csv", "jumplist_CustomDestinations.csv"]
