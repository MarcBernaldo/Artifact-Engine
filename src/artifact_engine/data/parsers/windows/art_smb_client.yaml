id: art_smb_client
name: "Outbound SMB (SMBClient channels)"
description: "Every SMB destination this host connected to, aggregated from the SMBClient channels, with the address and port decoded and NTSTATUS named. Flags a destination outside internal_networks on its own; otherwise two indicators are needed (admin share, non-SMB port, a refused connection, a target addressed by IP)."
source: "The SMBClient channels (via EvtxECmd)"
kind: artifact
os: windows
category: network
requires: ["Windows/System32/winevt/Logs/Microsoft-Windows-SMBClient%4Connectivity.evtx"]
depends_on: ["art_evtx_smb_client_conn", "art_evtx_smb_client_sec", "art_evtx_smb_client_op"]
provides: [smb_client_connections_csv]
handler: "artifact_engine.handlers.win_smbclient:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  smb_client: ["smb_client_connections.csv"]
