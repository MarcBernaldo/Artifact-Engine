id: art_lnk
name: "LNK files"
description: "Shortcut (.lnk) files = file/app access evidence (LECmd)"
source: "User profiles (.lnk)"
alert: context
os: windows
category: filesystem
requires: ["Users"]
provides: [lnk_csv]
tool:
  binary: LECmd.exe
  source:
    url: "https://download.ericzimmermanstools.com/net9/LECmd.zip"
    unpack: true
command:
  - "{binary}"
  - "-d"
  - "{evidence}/Users"
  - "-q"
  - "--csv"
  - "{out}"
  - "--csvf"
  - "art_lnk.csv"
timeout: 900
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  lnk: ["lnk.csv"]
