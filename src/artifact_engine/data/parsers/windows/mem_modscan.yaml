id: mem_modscan
name: "Memory: modscan (Volatility 3)"
description: "Kernel modules carved from the image, including unloaded and unlinked ones. Volatility 3 `windows.modscan.ModScan` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["mem_info"]
handler: "artifact_engine.handlers.mem_volatility:modscan"
timeout: 3600
