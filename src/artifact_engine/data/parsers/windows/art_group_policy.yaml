id: art_group_policy
name: "Group Policy registry settings (Registry.pol)"
description: "Administrative Templates settings from every Registry.pol: each GPO's Machine and User policy in SYSVOL (domain controllers) and the local policy, including policies no longer linked. Flags settings that disarm the host (Defender off or excluded, PowerShell or command-line auditing off, a firewall profile off, UAC off, WDigest cleartext credentials) and logon programs from staging folders or LOLBins."
source: "Windows/SYSVOL/<domain>/Policies/{GUID}/Machine|User/Registry.pol + System32/GroupPolicy"
kind: artifact
os: windows
category: persistence
requires: ["Windows"]
provides: [group_policy_csv]
handler: "artifact_engine.handlers.win_grouppolicy:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  grouppolicy: ["group_policy.csv"]
