id: alert_mem_etwpatch
name: "Memory: etwpatch (Volatility 3)"
description: "ETW functions patched in a process so event tracing stops reporting it. Fields: PID, Process, DLL, Function, Offset, Opcode. Volatility 3 `windows.etwpatch`."
source: "Memory image"
kind: alert
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:etwpatch"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
# v0.7.187: every row is a finding, so the table is alert_.
replaces:
  mem_etwpatch: ["mem_etwpatch.csv"]
  art_mem_etwpatch: ["art_mem_etwpatch.csv"]
