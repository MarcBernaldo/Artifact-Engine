id: alert_mem_drivermodule
name: "Memory: drivermodule (Volatility 3)"
description: "Driver objects with no module behind them, the trace a rootkit driver leaves. Fields: Offset, Known Exception, Driver Name, Service Key, Alternative Name. Volatility 3 `windows.malware.drivermodule`."
source: "Memory image"
kind: alert
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:drivermodule"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
# v0.7.187: every row is a finding, so the table is alert_.
replaces:
  mem_drivermodule: ["mem_drivermodule.csv"]
  art_mem_drivermodule: ["art_mem_drivermodule.csv"]
