id: art_mem_psscan
name: "Memory: psscan (Volatility 3)"
description: "Process objects carved from the image, exited and unlinked ones included; a PID here and not in pslist was hidden or has exited. Volatility 3 `windows.psscan`."
source: "Memory image"
kind: artifact
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:psscan"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  mem_psscan: ["mem_psscan.csv"]
