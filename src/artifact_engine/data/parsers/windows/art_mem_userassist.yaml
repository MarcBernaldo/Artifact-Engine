id: art_mem_userassist
name: "Memory: userassist (Volatility 3)"
description: "UserAssist from the hives in memory: programs a user started from the shell, with run count and last run. Volatility 3 `windows.registry.userassist.UserAssist` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:userassist"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  mem_userassist: ["mem_userassist.csv"]
