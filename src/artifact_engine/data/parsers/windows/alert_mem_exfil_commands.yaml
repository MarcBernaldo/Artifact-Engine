id: alert_mem_exfil_commands
name: "Memory: exfiltration command lines"
description: "Process command lines in the memory image that match a LOLExfil endpoint pattern; each row is also an alert in alert_mem. Fields: level, tool, detect_type, purpose, source, user, command_line, first_seen_utc, last_seen_utc, count, pattern."
source: "Memory image (Volatility tables)"
kind: alert
os: windows
category: memory
requires: ["memory.image"]
depends_on: ["art_mem_pslist", "art_mem_psscan", "art_mem_pstree", "art_mem_cmdline"]
provides: [exfil_commands_csv]
handler: "artifact_engine.handlers.mem_exfil_commands:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  mem_exfil_commands: ["exfil_commands.csv"]
