id: art_mem_pebmasquerade
name: "Memory: pebmasquerade (Volatility 3)"
description: "Processes whose PEB names a different image than the kernel does: a masqueraded process name. Volatility 3 `windows.malware.pebmasquerade.PebMasquerade` over the unit's memory image."
source: "Memory image"
alert: detect
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:pebmasquerade"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  mem_pebmasquerade: ["mem_pebmasquerade.csv"]
