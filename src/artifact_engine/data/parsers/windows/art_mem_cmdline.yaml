id: art_mem_cmdline
name: "Memory: cmdline (Volatility 3)"
description: "Command line of every process, read from its PEB. Volatility 3 `windows.cmdline.CmdLine` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:cmdline"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  mem_cmdline: ["mem_cmdline.csv"]
