id: mem_process_network
name: "Memory: process network"
description: "The image's process table: one row per socket found in the memory image (netscan, closed ones included; netstat without it) with the process that holds it, and one row per process that holds none -- path, command line, account, start time -- its parent's name and command line, and the remote address's scope (public / internal / private) and offline origin (country, ASN, Tor), and when netscan saw the socket created. The same table and columns as process_network from a Linux or Windows live response, so one host reads the same whatever it was collected from."
source: "Memory image (Volatility tables)"
alert: context
os: windows
category: memory
requires: ["memory.image"]
depends_on: ["mem_pslist", "mem_psscan", "mem_pstree", "mem_cmdline", "mem_getsids",
             "mem_netscan", "mem_netstat", "mem_symlinkscan", "mem_info"]
provides: [process_network_csv]
handler: "artifact_engine.handlers.mem_process_network:run"
