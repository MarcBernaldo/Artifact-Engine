id: alert_mem_suspicious_threads
name: "Memory: suspicious_threads (Volatility 3)"
description: "Threads that start in or run from memory no file backs: the thread an injection starts. Volatility 3 `windows.malware.suspicious_threads.SuspiciousThreads` over the unit's memory image."
source: "Memory image"
kind: alert
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:suspicious_threads"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
# v0.7.187: every row is a finding, so the table is alert_.
replaces:
  mem_suspicious_threads: ["mem_suspicious_threads.csv"]
  art_mem_suspicious_threads: ["art_mem_suspicious_threads.csv"]
