id: art_pca
name: "PCA app launch"
description: "Program Compatibility Assistant launch log (Win11 22H2+ execution)"
source: "PcaAppLaunchDic.txt (Windows 11)"
alert: context
os: windows
category: execution
requires: ["Windows/appcompat/pca/PcaAppLaunchDic.txt"]
provides: [pca_csv]
handler: "artifact_engine.handlers.win_pca:run"
outputs:
  - path: "{out}/art_pca.csv"
    format: csv
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  pca: ["pca.csv"]
