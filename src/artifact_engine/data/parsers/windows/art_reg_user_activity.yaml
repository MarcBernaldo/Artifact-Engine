id: art_reg_user_activity
name: "Registry: what each user ran and opened"
description: "Per-user registry keys no other parser reads, from NTUSER.DAT and UsrClass.dat: Compatibility Assistant store and compatibility modes (art_reg_compat_store), MUICache (art_reg_muicache), taskbar FeatureUsage (art_reg_feature_usage), common-dialog files and the program that opened them (art_reg_file_dialogs), and RecentDocs (art_reg_recent_docs). RECmd, transaction logs replayed; exec_hunt reads the execution keys."
source: "Each user's NTUSER.DAT and UsrClass.dat"
kind: artifact
os: windows
category: registry
handler: "artifact_engine.handlers.win_reg_activity:run"
requires: ["Users"]
provides: [reg_user_activity_csv]
outputs:
  - path: "{out}/art_reg_compat_store.csv"
  - path: "{out}/art_reg_muicache.csv"
  - path: "{out}/art_reg_feature_usage.csv"
  - path: "{out}/art_reg_file_dialogs.csv"
  - path: "{out}/art_reg_recent_docs.csv"
