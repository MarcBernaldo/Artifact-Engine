id: art_tasks
name: "Scheduled tasks (on-disk XML store)"
description: "Every task in Windows/System32/Tasks, independent of the TaskCache and event log: author, command and arguments, run-as principal, run level, triggers and the Hidden setting. Flags a command from a staging folder, a LOLBin action and a hidden task."
source: "Windows/System32/Tasks"
kind: artifact
os: windows
category: persistence
handler: "artifact_engine.handlers.win_tasks_disk:run"
requires: ["Windows/System32/Tasks"]
provides: [tasks_disk_csv]
outputs:
  - path: "{out}/art_tasks.csv"
    format: csv
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  tasks_disk: ["tasks_disk.csv"]
