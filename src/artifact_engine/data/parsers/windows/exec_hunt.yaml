id: exec_hunt
name: "Execution hunt (RMM, tunnels, LOLBAS, LOLDrivers, suspicious tools)"
description: "Every artifact that records a program (Amcache, Prefetch, ShimCache, BAM, UserAssist, PCA, SRUM, services, tasks, LNK, jump lists, Compatibility Assistant, MUICache, FeatureUsage, common dialogs, Sysmon 1, Security 4688, MFT programs and scripts, live-response processes) matched against four catalogues: alert_rmm (remote-access and tunnelling tools), alert_lolbas (LOLBAS binaries outside their home folder), alert_byovd (LOLDrivers hashes) and alert_suspicious_tools (suspicious_tools.txt names). The MFT pass skips WinSxS and the collector's copy of the disk. Fields: the match, path, sources, first_seen_utc, last_seen_utc, runs, users, sha1."
source: "Amcache, Prefetch, ShimCache, BAM, UserAssist, PCA, SRUM, services, tasks, LNK, jump lists, Compatibility Assistant store, MUICache, FeatureUsage, LastVisitedPidlMRU, Sysmon 1, Security 4688, $MFT, LiveResponse Pslist"
kind: alert
os: windows
category: detections
handler: "artifact_engine.handlers.win_exec_hunt:run"
outputs:
  - path: "{out}/alert_rmm.csv"
  - path: "{out}/alert_lolbas.csv"
  - path: "{out}/alert_byovd.csv"
  - path: "{out}/alert_suspicious_tools.csv"
depends_on: ["art_amcache", "art_prefetch", "art_reg_shimcache", "art_reg_bam", "art_reg_userassist", "art_pca", "art_srum",
             "art_reg_services", "art_tasks", "art_lnk", "art_jumplist", "art_reg_user_activity",
             "art_evtx_sysmon", "art_evtx_security", "art_mft", "art_collection", "art_pca_general"]
provides: [rmm_csv, lolbas_csv, byovd_csv, suspicious_tools_csv]
