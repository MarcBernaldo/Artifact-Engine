id: exec_hunt
name: "Execution hunt (RMM, tunnels, LOLBAS, LOLDrivers, suspicious tools)"
description: "One search of every artifact that records a program -- Amcache, Prefetch, ShimCache, BAM, UserAssist, PCA, SRUM, services, scheduled tasks, shortcuts and jump lists, the live response's processes -- for every catalog at once: remote-access and tunnelling tools (curated list, LOLRMM, LOTTunnels) into alert_rmm.csv, LOLBAS binaries relocated to a staging folder into alert_lolbas.csv, LOLDrivers hashes into alert_byovd.csv, and programs whose file name suspicious_tools.txt names (mimikatz, rubeus, sharphound, rclone...) into alert_suspicious_tools.csv. One row per finding and file with the artifacts that saw it, the first and last UTC time among them, the highest run count and the users."
source: "Amcache, Prefetch, ShimCache, BAM, UserAssist, PCA, SRUM, services, tasks, LNK, jump lists, LiveResponse Pslist"
alert: detect
os: windows
category: detections
handler: "artifact_engine.handlers.win_exec_hunt:run"
outputs:
  - path: "{out}/alert_rmm.csv"
  - path: "{out}/alert_lolbas.csv"
  - path: "{out}/alert_byovd.csv"
  - path: "{out}/alert_suspicious_tools.csv"
depends_on: ["art_amcache", "art_prefetch", "art_reg_shimcache", "art_reg_bam", "art_reg_userassist", "art_pca", "art_srum",
             "art_reg_services", "art_tasks", "art_lnk", "art_jumplist"]
provides: [rmm_csv, lolbas_csv, byovd_csv, suspicious_tools_csv]
