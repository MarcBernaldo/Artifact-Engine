id: hayabusa
name: "Hayabusa"
description: "Hayabusa over Windows Event Logs: Sigma detection timeline + logon summary + base64 extraction (Windows counterpart of the Linux log_sigma parser)"
source: "winevt/Logs"
alert: detect
os: windows
category: eventlogs
requires: ["Windows/System32/winevt/Logs"]
provides: [hayabusa_csv]
# A long pole (~200 s per volume, measured): dispatched ahead of ordinary tasks (v0.7.133).
weight: heavy
handler: "artifact_engine.handlers.win_eventlogs_hayabusa:run"
