id: art_consolehost
name: "PowerShell console history (PSReadLine)"
description: "Interactive PowerShell commands per user from ConsoleHost_history.txt (PSReadLine), multi-line commands rejoined. Often the only console record when 4688 has no command line. Flags download cradles, -EncodedCommand payloads, Defender tampering, LOLBin downloads and credential-access tooling."
source: "Each user's ConsoleHost_history.txt (PSReadLine)"
kind: artifact
os: windows
category: execution
handler: "artifact_engine.handlers.win_consolehost:run"
requires: ["Users"]
provides: [consolehost_csv]
outputs:
  - path: "{out}/art_consolehost.csv"
    format: csv
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  consolehost: ["consolehost.csv"]
