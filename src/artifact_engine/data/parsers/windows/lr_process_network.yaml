id: lr_process_network
name: "Process network (LiveResponse)"
description: "One row per live socket of the host (Velociraptor Netstat, or ListeningPorts without it) with the process that holds it -- path, command line, account, MD5/SHA1/SHA256, start time -- its parent's name and command line, and the remote address's scope (public / internal / private) and offline origin (country, ASN, Tor). The same table and columns as process_network from UAC or a memory image."
source: "Velociraptor LiveResponse output"
alert: context
os: windows
category: network
provides: [process_network_csv]
handler: "artifact_engine.handlers.win_process_network:run"
