id: art_prefetch
name: "Prefetch"
description: "Prefetch files: executable, run count, last eight run times and the files and volumes each run loaded. PECmd."
source: "Windows/Prefetch"
kind: artifact
os: windows
category: execution
short: art_prefetch   # PECmd also writes <csvf>_Timeline; short lowercases it
requires: ["Windows/prefetch"]
provides: [prefetch_csv]
tool:
  binary: PECmd.exe
  source:
    url: "https://download.ericzimmermanstools.com/net/PECmd.zip"
    unpack: true
command:
  - "{binary}"
  - "-d"
  - "{evidence}/Windows/prefetch"
  - "--csv"
  - "{out}"
  - "--csvf"
  - "art_prefetch.csv"
timeout: 600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  prefetch: ["prefetch.csv", "prefetch_Timeline.csv"]
