id: art_evtx_smb_client_op
name: "EVTX: SMB client operational"
description: "SMB client operational channel (shares this host mounted). Read by art_smb_client."
source: "SMBClient Operational"
alert: context
os: windows
category: eventlogs
requires: ["Windows/System32/winevt/Logs/Microsoft-Windows-SMBClient%4Operational.evtx"]
provides: [evtx_smbclient_op_csv]
tool:
  binary: EvtxECmd/EvtxECmd.exe
  source:
    url: "https://download.ericzimmermanstools.com/net9/EvtxECmd.zip"
    unpack: true
command:
  - "{binary}"
  - "-f"
  - "{evidence}/Windows/System32/winevt/Logs/Microsoft-Windows-SMBClient%4Operational.evtx"
  - "--csv"
  - "{out}"
  - "--csvf"
  - "art_evtx_smb_client_op.csv"
timeout: 600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  evtx_smbclient_op: ["evtx_smbclient_op.csv"]
