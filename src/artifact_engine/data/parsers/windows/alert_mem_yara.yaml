id: alert_mem_yara
name: "Memory: YARA over process memory"
description: "The bundled YARA rules (the disk scan's set, signature-base and YARA-Forge included) matched against every process's virtual memory, where code that never touched disk is visible. A match inside a security product's own process is marked. Fields: pid, process, rule, hits, samples, description, score, author, reference, in_security_product."
source: "Memory image"
kind: alert
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_yara:run"
# Every page of every process: 10.6 min on a real 18 GB image.
timeout: 7200
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  mem_yara: ["mem_yara.csv"]
