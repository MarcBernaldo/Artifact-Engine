id: alert_mem_yara
name: "Memory: YARA over process memory"
description: "The bundled YARA rules (assets/yara, signature-base included -- the same set the disk scan uses) compiled once and matched by Volatility 3 windows.vadyarascan (the engine's copy, aeng_windows.VadYaraScan, which does not stop the scan on a match Volatility 2.28 cannot render) against the virtual memory of every process: code that never touched the disk is only visible here. One row per process and rule (strings matched, a sample of what and where, the rule's description, score and reference); a match inside an endpoint-security product's own process is marked, since it is usually that product's signatures. mem_findings turns the table into alerts."
source: "Memory image"
alert: detect
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_yara:run"
# Every page of every process: 10.6 min on a real 18 GB image.
timeout: 7200
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  mem_yara: ["mem_yara.csv"]
