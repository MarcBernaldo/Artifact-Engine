id: alert_hayabusa_timeline
name: "Hayabusa detection timeline"
description: "Hayabusa's Sigma detection timeline over the Windows event logs, one row per matching event. Fields: Timestamp, RuleTitle, Level, Computer, Channel, EventID, RecordID, Details, ExtraFieldInfo, RuleID. Also writes art_hayabusa_base64, the base64 strings hayabusa decoded from the logs."
source: "winevt/Logs"
kind: alert
os: windows
category: eventlogs
requires: ["Windows/System32/winevt/Logs"]
provides: [hayabusa_csv]
# A long pole (~200 s per volume, measured): dispatched ahead of ordinary tasks (v0.7.133).
weight: heavy
handler: "artifact_engine.handlers.win_eventlogs_hayabusa:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
# v0.7.187: every row is a finding, so the table is alert_.
replaces:
  hayabusa: ["hayabusa.csv", "hayabusa_base64.csv"]
  art_hayabusa: ["art_hayabusa.csv"]
