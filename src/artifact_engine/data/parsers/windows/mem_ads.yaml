id: mem_ads
name: "Memory: mftscan (Volatility 3)"
description: "Alternate data streams found in MFT records in memory (Zone.Identifier, and payloads hidden in a stream). Volatility 3 `windows.mftscan.ADS` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["mem_info"]
handler: "artifact_engine.handlers.mem_volatility:ads"
timeout: 3600
