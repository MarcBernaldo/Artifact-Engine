id: art_sysvol
name: "SYSVOL (Group Policy Preferences + scripts)"
description: "Domain controller SYSVOL: Group Policy Preferences (scheduled tasks, groups, services pushed domain-wide) with cpassword decrypted (MS14-025), and logon, logoff, startup and shutdown script assignments. Flags any stored cpassword, a GPP task run from a staging folder or LOLBin, a group adding members to Administrators, and a script from a temp, public or web path."
source: "Windows/SYSVOL (domain controllers only)"
kind: artifact
os: windows
category: persistence
handler: "artifact_engine.handlers.win_sysvol:run"
requires: ["Windows/SYSVOL"]
provides: [sysvol_csv]
# SYSVOL barely changes and a snapshot mirrors the live DC -> no need on VSS.
on_vss: false
outputs:
  - path: "{out}/art_sysvol_gpp.csv"
    format: csv
  - path: "{out}/art_sysvol_scripts.csv"
    format: csv
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  sysvol: ["sysvol_gpp.csv", "sysvol_scripts.csv"]
