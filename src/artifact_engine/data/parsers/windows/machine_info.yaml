id: win_machine_info
name: "Machine info"
description: "Hostname, OS, IPs and users from the hives (SYSTEM/SOFTWARE), plus what a Velociraptor live response adds: domain role, time zone, boot time, interfaces, local accounts with their last logon"
source: "SYSTEM and SOFTWARE hives; Velociraptor Generic.Client.Info when collected"
alert: context
os: windows
category: systeminfo
requires: ["Windows/System32/config/SYSTEM"]
provides: [machine_info]
handler: "artifact_engine.handlers.win_systeminfo:run"
outputs:
  - path: "{out}/machine_info.json"
    format: json
