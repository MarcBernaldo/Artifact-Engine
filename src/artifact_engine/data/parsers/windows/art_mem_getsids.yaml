id: art_mem_getsids
name: "Memory: getsids (Volatility 3)"
description: "Security identifiers of every process token: which account each process ran as. Volatility 3 `windows.getsids.GetSIDs` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:getsids"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  mem_getsids: ["mem_getsids.csv"]
