id: mem_amcache
name: "Memory: amcache (Volatility 3)"
description: "Amcache from the hive in memory: programs and drivers with SHA1 and install time. Volatility 3 `windows.registry.amcache.Amcache` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["mem_info"]
handler: "artifact_engine.handlers.mem_volatility:amcache"
timeout: 3600
