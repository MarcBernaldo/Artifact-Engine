id: art_process_network_lr
name: "Process network (LiveResponse)"
description: "Process and socket table from the Velociraptor live response: one row per socket (Netstat, or ListeningPorts) with the owning process, and one per process without sockets, with path, command line, account, elevation, MD5/SHA1/SHA256, Authenticode signer, start time, parent and the remote address's scope and offline origin (country, ASN, Tor). Same columns as the UAC and memory process_network tables."
source: "Velociraptor LiveResponse output"
kind: artifact
os: windows
category: network
provides: [process_network_csv]
handler: "artifact_engine.handlers.win_process_network:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  lr_process_network: ["process_network.csv"]
