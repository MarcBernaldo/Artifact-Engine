id: mem_findings
name: "Memory: findings"
description: "What in a memory image deserves a look first, read from the unit's Volatility tables (never the image): hidden processes, system processes under the wrong parent / duplicated / out of place / one character away from a system name, processes run from user-writable folders, documents or browsers spawning shells, attack-shaped command lines (shadow-copy deletion, log clearing, encoded PowerShell, download cradles, credential dumping, named offensive tools), shells talking to the internet, injected code (a PE header in an unbacked region is high), hollowed / ghosted / PEB-masqueraded processes, Skeleton Key, drivers with no module, hidden services, ETW patching, orphan and suspicious threads. Writes mem_alerts (one row per alert, every rule in one table) and mem_processes (one row per process with parent, path, command line, account, connections and injected regions beside it, flagged from the alerts). A table a plugin did not produce is listed as a coverage row, so an empty alert table is never an unread one."
source: "Memory image (Volatility tables)"
alert: flag
os: windows
category: memory
requires: ["memory.image"]
depends_on: ["mem_pslist", "mem_psscan", "mem_pstree", "mem_cmdline", "mem_getsids",
             "mem_netscan", "mem_malfind", "mem_hollowprocesses", "mem_processghosting",
             "mem_pebmasquerade", "mem_psxview", "mem_drivermodule", "mem_svcdiff",
             "mem_skeleton_key", "mem_etwpatch", "mem_orphan_threads",
             "mem_suspicious_threads"]
handler: "artifact_engine.handlers.mem_findings:run"
