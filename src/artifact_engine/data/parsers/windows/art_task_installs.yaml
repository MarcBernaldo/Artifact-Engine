id: art_task_installs
name: "Scheduled task installs (106/141) + what they ran"
description: "The lifecycle of every scheduled task in the Task Scheduler channel: who registered it (106), who removed it (141), what it ran (200/201) and whether its XML is still on disk. The only record of a task deleted after it ran. Flags a task registered, run and removed within the hour. Known task names are tagged when `aeng update` has fetched the lists; greyware is never flagged."
source: "TaskScheduler Operational"
kind: artifact
os: windows
category: persistence
requires: ["Windows/System32/winevt/Logs/Microsoft-Windows-TaskScheduler%4Operational.evtx"]
depends_on: ["art_evtx_tasks", "art_tasks"]
provides: [task_installs_csv]
handler: "artifact_engine.handlers.win_task_installs:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  task_installs: ["task_installs.csv"]
