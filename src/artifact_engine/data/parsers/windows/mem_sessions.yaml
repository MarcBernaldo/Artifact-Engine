id: mem_sessions
name: "Memory: sessions (Volatility 3)"
description: "Logon sessions and the processes in each, with user name and session type. Volatility 3 `windows.sessions.Sessions` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["mem_info"]
handler: "artifact_engine.handlers.mem_volatility:sessions"
timeout: 3600
