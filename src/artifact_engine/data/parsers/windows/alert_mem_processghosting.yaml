id: alert_mem_processghosting
name: "Memory: processghosting (Volatility 3)"
description: "Processes created from a file that was deleted before it ran: process ghosting. Volatility 3 `windows.malware.processghosting.ProcessGhosting` over the unit's memory image."
source: "Memory image"
kind: alert
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:processghosting"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
# v0.7.187: every row is a finding, so the table is alert_.
replaces:
  mem_processghosting: ["mem_processghosting.csv"]
  art_mem_processghosting: ["art_mem_processghosting.csv"]
