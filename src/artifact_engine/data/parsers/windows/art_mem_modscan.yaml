id: art_mem_modscan
name: "Memory: modscan (Volatility 3)"
description: "Kernel modules carved from the image, unloaded and unlinked ones included. Volatility 3 `windows.modscan`."
source: "Memory image"
kind: artifact
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:modscan"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  mem_modscan: ["mem_modscan.csv"]
