id: alert_mem_svcdiff
name: "Memory: svcdiff (Volatility 3)"
description: "Services found by scanning that the Service Control Manager's list no longer shows (hidden by unlinking). Fields: Offset, Order, PID, Start, State, Type, Name, Display, Binary, Binary (Registry), Dll. Volatility 3 `windows.malware.svcdiff`."
source: "Memory image"
kind: alert
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:svcdiff"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
# v0.7.187: every row is a finding, so the table is alert_.
replaces:
  mem_svcdiff: ["mem_svcdiff.csv"]
  art_mem_svcdiff: ["art_mem_svcdiff.csv"]
