id: art_mem_pslist
name: "Memory: pslist (Volatility 3)"
description: "Processes on the kernel's active list: PID, parent, image, threads, session, creation and exit time. Volatility 3 `windows.pslist.PsList` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:pslist"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  mem_pslist: ["mem_pslist.csv"]
