id: mem_shimcache
name: "Memory: shimcachemem (Volatility 3)"
description: "AppCompatCache still in kernel memory: newer than the one last written to the SYSTEM hive on disk. Volatility 3 `windows.shimcachemem.ShimcacheMem` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["mem_info"]
handler: "artifact_engine.handlers.mem_volatility:shimcache"
timeout: 3600
