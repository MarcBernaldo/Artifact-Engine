id: art_service_installs
name: "Service installs (7045) + remote execution"
description: "Service installs (System 7045) that show a remote-execution indicator: an ImagePath that is a command shell, output redirected to a temporary file or named pipe, a generated-looking name, an image in a writable folder; in_registry says whether the service still exists. Flags a shell ImagePath, a known offensive tool, or three indicators together (the PsExec/impacket pattern). Known names are tagged once `aeng update` has fetched the lists; greyware is never flagged."
source: "System 7045 events + art_reg_services"
kind: artifact
os: windows
category: eventlogs
requires: ["Windows/System32/winevt/Logs/System.evtx"]
depends_on: ["art_evtx_system", "art_reg_services"]
provides: [service_installs_csv]
handler: "artifact_engine.handlers.win_service_installs:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  service_installs: ["service_installs.csv"]
