id: alert_mem_orphan_threads
name: "Memory: orphan_kernel_threads (Volatility 3)"
description: "Kernel threads whose start address lies in no loaded module: code running from memory a driver left behind. Volatility 3 `windows.orphan_kernel_threads.Threads` over the unit's memory image."
source: "Memory image"
kind: alert
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:orphan_threads"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
# v0.7.187: every row is a finding, so the table is alert_.
replaces:
  mem_orphan_threads: ["mem_orphan_threads.csv"]
  art_mem_orphan_threads: ["art_mem_orphan_threads.csv"]
