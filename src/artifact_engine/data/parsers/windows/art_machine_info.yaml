id: art_machine_info
name: "Machine info"
description: "Host identity from the SYSTEM and SOFTWARE hives: hostname, OS, IP addresses, users and time zone (name, standard offset, daylight saving). A Velociraptor live response adds domain role, the zone at collection, boot time, interfaces and local accounts with last logon."
source: "SYSTEM and SOFTWARE hives; Velociraptor Generic.Client.Info when collected"
kind: artifact
os: windows
category: systeminfo
requires: ["Windows/System32/config/SYSTEM"]
provides: [machine_info]
handler: "artifact_engine.handlers.win_systeminfo:run"
outputs:
  - path: "{out}/art_machine_info.json"
    format: json
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  win_machine_info: ["machine_info.csv"]
