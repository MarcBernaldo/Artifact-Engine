id: art_mem_process_network
name: "Memory: process network"
description: "Process and socket table built from the memory tables: one row per socket (netscan, closed ones included; netstat otherwise) with the owning process, and one per process without sockets, with path, command line, account, start time, parent, socket creation time and the remote address's scope and offline origin (country, ASN, Tor). Same columns as the live-response and Linux process_network tables."
source: "Memory image (Volatility tables)"
kind: artifact
os: windows
category: memory
requires: ["memory.image"]
depends_on: ["art_mem_pslist", "art_mem_psscan", "art_mem_pstree", "art_mem_cmdline", "art_mem_getsids",
             "art_mem_netscan", "art_mem_netstat", "art_mem_symlinkscan", "art_mem_info"]
provides: [process_network_csv]
handler: "artifact_engine.handlers.mem_process_network:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  mem_process_network: ["mem_process_network.csv", "process_network.csv"]
