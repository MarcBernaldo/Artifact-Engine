id: alert_yara   # the linux one is alert_yara_linux (ids are global; a collision is silently dropped by load_parsers)
name: "YARA scan"
description: "YARA matches in Windows staging directories (user Temp, Downloads, Desktop, AppData Roaming, Windows\\Temp, ProgramData, Public, $Recycle.Bin, inetpub) with the bundled rules, signature-base and YARA-Forge. Never scans the engine's own output. Fields: rule, tags, path, size, strings, score, author, description, reference, suspicious."
source: "Staging directories"
kind: alert
os: windows
category: detections
provides: [yara_csv]
handler: "artifact_engine.handlers.win_yara:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  win_yara: ["yara.csv"]
