id: alert_mem_sigma
name: "Memory: Sigma over processes"
description: "SigmaHQ Windows process_creation rules over the processes in the memory image, built from the Volatility tables with drive letters restored where the image names them. A field memory does not hold is empty, so a rule can miss but never fires on it. Fields: pid, process, rule, level, rule_id, tags, path, command_line, parent_path."
source: "Memory image (Volatility tables)"
kind: alert
os: windows
category: memory
requires: ["memory.image"]
depends_on: ["art_mem_pslist", "art_mem_psscan", "art_mem_pstree", "art_mem_cmdline", "art_mem_getsids",
             "art_mem_symlinkscan", "art_mem_info"]
handler: "artifact_engine.handlers.mem_sigma:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  mem_sigma: ["mem_sigma.csv"]
