id: art_reg_userassist
name: "Registry: UserAssist"
description: "Programs each user ran from the shell (UserAssist, NTUSER.DAT), with run count and last run, as decoded by RECmd."
source: "Each user's NTUSER.DAT"
kind: artifact
os: windows
category: registry
requires: ["Users"]
provides: [reg_userassist_csv]
tool:
  binary: RECmd/RECmd.exe
  source:
    url: "https://download.ericzimmermanstools.com/net/RECmd.zip"
    unpack: true
command:
  - "{binary}"
  - "-d"
  - "{evidence}/Users"
  - "--bn"
  - "{assets}/recmd/UserAssist.reb"
  - "--csv"
  - "{out}"
  - "--csvf"
  - "art_reg_userassist.csv"
timeout: 600
# A dirty hive with no transaction logs beside it aborts the run; --nl true
# allows them to be absent (present ones are still replayed).
retry:
  when: "no transaction logs were found"
  add: ["--nl", "true"]
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  reg_userassist: ["reg_userAssist.csv"]
