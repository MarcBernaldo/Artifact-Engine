id: liveresponse
name: "Velociraptor LiveResponse"
description: "Velociraptor LiveResponse (volatile/live state): normalises services, drivers, DNS/ARP caches, users, shares, etc. into JSONs/ with a per-row flag column (scheduled tasks, WMI persistence and client info only where the disk source tasks_disk / art_wmi_persistence / machine_info read was not collected; the processes, netstat and listening ports are art_process_network_lr's process table), and runs a low-FP suspicious pass (staging-dir execution, LOLBINs, masquerading, BYOVD drivers, staged listeners/connections, WMI persistence)."
source: "Velociraptor LiveResponse output"
alert: flag
os: windows
category: liveresponse
handler: "artifact_engine.handlers.win_liveresponse_velociraptor:run"
