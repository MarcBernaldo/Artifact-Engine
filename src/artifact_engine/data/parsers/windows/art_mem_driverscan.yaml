id: art_mem_driverscan
name: "Memory: driverscan (Volatility 3)"
description: "Driver objects carved from the image, with service key and driver name. Volatility 3 `windows.driverscan.DriverScan` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:driverscan"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  mem_driverscan: ["mem_driverscan.csv"]
