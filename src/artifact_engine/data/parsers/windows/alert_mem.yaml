id: alert_mem
name: "Memory: findings"
description: "Findings from the unit's Volatility tables (never the image): hidden processes; system processes with the wrong parent, duplicated, misplaced or misspelled; execution from user-writable folders; documents or browsers spawning shells; attack command lines; shells talking to the internet; injected, hollowed, ghosted or masqueraded processes; Skeleton Key; hidden drivers and services; ETW patching; orphan and suspicious threads; YARA hits. Fields: level, rule, pid, process, ppid, parent, path, detail, source. Also writes art_mem_processes, one row per process seen, marked suspicious with a level where it raised an alert."
source: "Memory image (Volatility tables)"
kind: alert
os: windows
category: memory
requires: ["memory.image"]
depends_on: ["art_mem_pslist", "art_mem_psscan", "art_mem_pstree", "art_mem_cmdline", "art_mem_getsids",
             "art_mem_netscan", "alert_mem_malfind", "alert_mem_hollowprocesses", "alert_mem_processghosting",
             "art_mem_pebmasquerade", "art_mem_psxview", "alert_mem_drivermodule", "alert_mem_svcdiff",
             "art_mem_skeleton_key", "alert_mem_etwpatch", "alert_mem_orphan_threads",
             "alert_mem_suspicious_threads", "alert_mem_yara", "art_mem_symlinkscan", "art_mem_info",
             "alert_mem_sigma", "alert_mem_exfil_commands"]
handler: "artifact_engine.handlers.mem_findings:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  mem_findings: ["mem_alerts.csv", "mem_findings.csv", "mem_processes.csv"]
