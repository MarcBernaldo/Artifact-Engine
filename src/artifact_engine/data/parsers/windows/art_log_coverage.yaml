id: art_log_coverage
name: "Log coverage"
description: "How far back each Windows event channel actually reaches, measured from the already-parsed EvtxECmd dumps: per-channel first/last event, days with events, and the widest interior gap -- flagged only when a channel went dark while its siblings kept logging. Also reports 1102/104/4719/1100 presence AND absence, since 'the log was never cleared' is a finding too."
source: "The channels EvtxECmd already dumped"
alert: flag
os: windows
category: systeminfo
requires: ["Windows/System32/winevt/Logs"]
depends_on: ["art_evtx_security", "art_evtx_system", "art_evtx_application", "art_evtx_sysmon",
             "art_evtx_defender", "art_evtx_bits", "art_evtx_powershell", "art_evtx_powershell_scripts",
             "art_evtx_rdp_auth", "art_evtx_rdp_in", "art_evtx_rdp_out", "art_evtx_rdp_sessions",
             "art_evtx_tasks", "art_evtx_wmi"]
provides: [log_coverage_csv]
handler: "artifact_engine.handlers.win_log_coverage:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  log_coverage: ["log_coverage.csv"]
