id: alert_defender
name: "Defender detections + tampering"
description: "Microsoft Defender detections and tampering from the Operational channel, with the outcome of each detection across retries; CmdLine resources are reported as command lines. Real-time protection and configuration changes (5001, 5007, 5010, 5012) are rows too. Flags detections never acted on. Fields: timestamp_utc, event_id, kind, detection_id, threat_name, level, category, path, command_line, other_resources, process, detection_user, detection_source, action, remediation_user, error_code, outcome, suspicious."
source: "Defender Operational channel (via EvtxECmd)"
kind: alert
os: windows
category: detections
requires: ["Windows/System32/winevt/Logs/Microsoft-Windows-Windows Defender%4Operational.evtx"]
depends_on: ["art_evtx_defender"]
provides: [defender_detections_csv]
handler: "artifact_engine.handlers.win_defender:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  defender_detections: ["defender_detections.csv"]
