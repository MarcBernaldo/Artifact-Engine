id: art_collection
name: "Collection's own copy of the disk ($MFT)"
description: "Directories whose children are the volume's own root: a copy of the disk a collector wrote onto the disk it was collecting. Paths under them are second copies of files that live elsewhere, so `aeng sweep` and exec_hunt skip them by default (`--include-collection` searches them). Windows.old and a collector's tool directory are listed but never skipped."
source: "$MFT (via art_mft.csv)"
kind: artifact
os: windows
category: filesystem
requires: ["$MFT"]
depends_on: ["art_mft"]
provides: [collection_artifacts_csv]
# No art_mft.csv is transcoded per snapshot (see art_mft), so there is nothing
# to read on a VSS machine.
on_vss: false
handler: "artifact_engine.handlers.win_collection:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
# v0.7.187: an inventory of copies, not a finding, so the table is art_.
replaces:
  collection_artifacts_mft: ["collection_artifacts.csv"]
  alert_collection: ["alert_collection.csv"]
