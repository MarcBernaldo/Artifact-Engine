id: alert_hayabusa
name: "Sigma detections by rule and source address"
description: "The hayabusa timeline aggregated to one row per level, rule and source address, with the source's scope (internal, private or public). A rule whose premise is a public source is downgraded when the source is internal or private, with the reason in triage. No row cap: every detection is in one row. Fields: level, rule, source_ip, scope, hits, first_seen, last_seen, host, channel, event_ids, triage, suspicious."
source: "alert_hayabusa_timeline.csv"
kind: alert
os: windows
category: detections
requires: ["Windows/System32/winevt/Logs"]
depends_on: ["alert_hayabusa_timeline"]
provides: [sigma_sources_csv]
handler: "artifact_engine.handlers.win_sigma_sources:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  sigma_sources: ["sigma_sources.csv"]
