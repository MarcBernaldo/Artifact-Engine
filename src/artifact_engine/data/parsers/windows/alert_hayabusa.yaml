id: alert_hayabusa
name: "Sigma detections by rule and source address"
description: "Hayabusa's alert: its per-event timeline aggregated to one row per (rule, source address), with which side of the perimeter that source is on. On an estate holding its own routable address space the timeline is mostly one rule saying the same thing four hundred times about four hundred ordinary internal sessions; here that is one row, marked `internal`. Where the RULE'S OWN PREMISE is that the source is public -- a small set of patterns read off the shipped ruleset, not a substring match, because `Outbound Network Connection To Public IP` is about a DESTINATION -- the row is DOWNGRADED with the reason beside it. Every other rule keeps its level: one firing from an internal address is lateral movement. Hayabusa's own CSV is never rewritten; this is a second table beside it, and the detections that name no source are one row per (level, rule) with an empty source_ip and there is no row cap (v0.7.170), so every detection is in one row and the front page reads this table instead of the timeline."
source: "art_hayabusa.csv"
alert: detect
os: windows
category: detections
requires: ["Windows/System32/winevt/Logs"]
depends_on: ["art_hayabusa"]
provides: [sigma_sources_csv]
handler: "artifact_engine.handlers.win_sigma_sources:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  sigma_sources: ["sigma_sources.csv"]
