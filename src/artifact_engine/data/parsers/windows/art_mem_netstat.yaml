id: art_mem_netstat
name: "Memory: netstat (Volatility 3)"
description: "Network connections and listeners on the live TCP/IP tables at acquisition time, with the owning process. Volatility 3 `windows.netstat.NetStat` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:netstat"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  mem_netstat: ["mem_netstat.csv"]
