id: art_reg_rdp_outbound
name: "Outbound RDP history (Terminal Server Client MRU)"
description: "Hosts each user connected to over RDP, from NTUSER.DAT: the Default MRU list with each server's UsernameHint (the account used), the key's last write as an approximate last connection, and whether an untrusted certificate was accepted. Survives event-log rollover; feeds the lateral-movement graph."
source: "Each user's NTUSER.DAT"
kind: artifact
os: windows
category: registry
handler: "artifact_engine.handlers.win_rdp_mru:run"
requires: ["Users"]
provides: [rdp_outbound_csv]
outputs:
  - path: "{out}/art_reg_rdp_outbound.csv"
    format: csv
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  reg_rdp_outbound: ["rdp_outbound.csv"]
