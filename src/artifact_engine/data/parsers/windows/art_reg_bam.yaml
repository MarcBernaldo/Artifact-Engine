id: art_reg_bam
name: "Registry: BAM/DAM"
description: "Background and Desktop Activity Moderator entries from the SYSTEM hive: last run time of each program per user SID."
source: "SYSTEM hive"
kind: artifact
os: windows
category: registry
requires: ["Windows/System32/config/SYSTEM"]
provides: [reg_bamdam_csv]
tool:
  binary: RECmd/RECmd.exe
  source:
    url: "https://download.ericzimmermanstools.com/net/RECmd.zip"
    unpack: true
command:
  - "{binary}"
  - "-d"
  - "{evidence}/Windows/System32/config"
  - "--bn"
  - "{assets}/recmd/BamDam.reb"
  - "--csv"
  - "{out}"
  - "--csvf"
  - "art_reg_bam.csv"
timeout: 600
# A dirty hive with no transaction logs beside it aborts the run; --nl true
# allows them to be absent (present ones are still replayed).
retry:
  when: "no transaction logs were found"
  add: ["--nl", "true"]
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  reg_bamdam: ["reg_bamDam.csv"]
