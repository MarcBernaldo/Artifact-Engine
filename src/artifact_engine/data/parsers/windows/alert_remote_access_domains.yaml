id: alert_remote_access_domains
name: "Remote-access and tunnel domains"
description: "Domains of remote-access and tunnelling tools (LOLRMM and LOTTunnels lists: ngrok, cloudflared, AnyDesk relays, Dev Tunnels...) in browser history and downloads and, on the live volume, the Velociraptor DNS cache. Places the tool on the host even when its binary is gone; allowed support tools also match. Fields: tool, catalog, match, domain, source, user, hits, last_seen_utc, example."
source: "art_browser_history / art_browser_downloads + Velociraptor LiveResponse DNSCache"
kind: alert
os: windows
category: network
depends_on: ["art_browser"]
provides: [remote_access_domains_csv]
handler: "artifact_engine.handlers.win_remote_access_domains:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  remote_access_domains: ["remote_access_domains.csv"]
