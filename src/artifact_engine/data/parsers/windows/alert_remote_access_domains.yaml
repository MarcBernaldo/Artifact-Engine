id: alert_remote_access_domains
name: "Remote-access and tunnel domains"
description: "Host names a remote-access or tunnelling tool talks to (ngrok, cloudflared quick tunnels, AnyDesk relays, Dev Tunnels...), from the LOLRMM and LOTTunnels domain lists, found in the browser's history and downloads and, on the live volume, a Velociraptor LiveResponse's DNS cache. One row per tool, host, source and user with the number of entries, the latest time and an example. Puts the tool on the machine even when its binary is gone; support tools the estate allows match too."
source: "art_browser_history / art_browser_downloads + Velociraptor LiveResponse DNSCache"
alert: context
os: windows
category: network
depends_on: ["art_browser"]
provides: [remote_access_domains_csv]
handler: "artifact_engine.handlers.win_remote_access_domains:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  remote_access_domains: ["remote_access_domains.csv"]
