id: mem_psxview
name: "Memory: psxview (Volatility 3)"
description: "Every process seen by each enumeration method side by side; a process missing from the active list but found by the others was unlinked. Volatility 3 `windows.malware.psxview.PsXView` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["mem_info"]
handler: "artifact_engine.handlers.mem_volatility:psxview"
timeout: 3600
