id: credential_access
name: "Credential material staged for collection ($MFT)"
description: "Registry hives, DPAPI master keys and the Vault, browser credential databases, SSH key material and LSASS dumps found OUTSIDE the places those names belong -- no IOC, hash or signature needed, because every one of these files is ordinary in its own directory and means something else anywhere in particular. The row is the DIRECTORY, not the file: two different families in one tree (judged together with its immediate children) is the staging heuristic, and it turns a dozen scattered rows into one sentence. Nothing filters on InUse, because the tree is normally deleted after it is archived -- and once a directory qualifies the volume is re-read for archives written near it in time, the deleted ones included."
os: windows
category: detections
requires: ["$MFT"]
depends_on: ["mft_transcode"]
provides: [credential_access_csv]
# No MFT.csv is transcoded per snapshot (see mft_transcode), so there is nothing
# to read on a VSS machine.
on_vss: false
handler: "artifact_engine.handlers.win_credential_access:run"
