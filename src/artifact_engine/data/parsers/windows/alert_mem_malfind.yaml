id: alert_mem_malfind
name: "Memory: malfind (Volatility 3)"
description: "Process memory that is executable, private and not backed by a file: injected code, with the first bytes and their disassembly. Volatility 3 `windows.malware.malfind.Malfind` over the unit's memory image."
source: "Memory image"
kind: alert
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:malfind"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
# v0.7.187: every row is a finding, so the table is alert_.
replaces:
  mem_malfind: ["mem_malfind.csv"]
  art_mem_malfind: ["art_mem_malfind.csv"]
