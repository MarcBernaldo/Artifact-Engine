id: art_recentfilecache
name: "RecentFileCache"
description: "RecentFileCache.bcf (Windows 7): paths of programs recently run. RecentFileCacheParser."
source: "RecentFileCache.bcf (Windows 7)"
kind: artifact
os: windows
category: execution
requires: ["Windows/AppCompat/Programs/RecentFileCache.bcf"]
provides: [recentfilecache_csv]
tool:
  binary: RecentFileCacheParser.exe
  source:
    url: "https://download.ericzimmermanstools.com/net/RecentFileCacheParser.zip"
    unpack: true
command:
  - "{binary}"
  - "-f"
  - "{evidence}/Windows/AppCompat/Programs/RecentFileCache.bcf"
  - "--csv"
  - "{out}"
  - "--csvf"
  - "art_recentfilecache.csv"
timeout: 300
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  recentfilecache: ["recentfilecache.csv"]
