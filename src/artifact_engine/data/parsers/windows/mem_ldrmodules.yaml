id: mem_ldrmodules
name: "Memory: ldrmodules (Volatility 3)"
description: "Every mapped image of every process against the three loader lists; a DLL mapped but absent from them was hidden or loaded by hand. Volatility 3 `windows.malware.ldrmodules.LdrModules` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["mem_info"]
handler: "artifact_engine.handlers.mem_volatility:ldrmodules"
timeout: 3600
