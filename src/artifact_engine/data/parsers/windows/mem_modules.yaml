id: mem_modules
name: "Memory: modules (Volatility 3)"
description: "Kernel modules (drivers) on the loaded-module list, with path and size. Volatility 3 `windows.modules.Modules` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["mem_info"]
handler: "artifact_engine.handlers.mem_volatility:modules"
timeout: 3600
