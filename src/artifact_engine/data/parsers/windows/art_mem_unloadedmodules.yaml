id: art_mem_unloadedmodules
name: "Memory: unloadedmodules (Volatility 3)"
description: "Kernel modules recently unloaded, with when (a driver loaded only for a moment). Volatility 3 `windows.unloadedmodules.UnloadedModules` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:unloadedmodules"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  mem_unloadedmodules: ["mem_unloadedmodules.csv"]
