id: mem_privileges
name: "Memory: privileges (Volatility 3)"
description: "Token privileges of every process, present and enabled (SeDebugPrivilege on a user process is a lead). Volatility 3 `windows.privileges.Privs` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["mem_info"]
handler: "artifact_engine.handlers.mem_volatility:privileges"
timeout: 3600
