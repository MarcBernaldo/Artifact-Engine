id: art_reg_explorer_input
name: "Explorer typed input (WordWheelQuery + TypedPaths)"
description: "What each user typed into Explorer, from NTUSER.DAT: searches (WordWheelQuery) and address-bar paths (TypedPaths, where UNC targets show hand-typed lateral movement). order 0 is the most recent, dated by the key's last write."
source: "Each user's NTUSER.DAT"
kind: artifact
os: windows
category: registry
handler: "artifact_engine.handlers.win_explorer_input:run"
requires: ["Users"]
provides: [explorer_input_csv]
outputs:
  - path: "{out}/art_reg_explorer_input.csv"
    format: csv
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  reg_explorer_input: ["explorer_input.csv"]
