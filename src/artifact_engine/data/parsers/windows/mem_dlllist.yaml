id: mem_dlllist
name: "Memory: dlllist (Volatility 3)"
description: "Modules loaded by every process, with path, base and load time. Volatility 3 `windows.dlllist.DllList` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["mem_info"]
handler: "artifact_engine.handlers.mem_volatility:dlllist"
timeout: 3600
