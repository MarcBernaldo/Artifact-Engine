id: art_mem_handles
name: "Memory: handles (Volatility 3)"
description: "Open handles of every process: files, registry keys, mutexes, processes and threads. Volatility 3 `windows.handles.Handles` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:handles"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  mem_handles: ["mem_handles.csv"]
