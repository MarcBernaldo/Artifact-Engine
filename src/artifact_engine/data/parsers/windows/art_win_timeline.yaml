id: art_win_timeline
name: "Windows Timeline"
description: "Windows 10 Timeline (ActivitiesCache.db) per user: applications run, files opened and focus duration. Flags an application or file in a staging folder, or a LOLBin."
source: "Each user's ActivitiesCache.db"
kind: artifact
os: windows
category: execution
handler: "artifact_engine.handlers.win_timeline:run"
requires: ["Users"]
provides: [timeline_csv]
outputs:
  - path: "{out}/art_win_timeline.csv"
    format: csv
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  timeline: ["timeline.csv"]
