id: art_mem_mutantscan
name: "Memory: mutantscan (Volatility 3)"
description: "Mutexes carved from the image; malware families are often known by theirs. Volatility 3 `windows.mutantscan.MutantScan` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:mutantscan"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  mem_mutantscan: ["mem_mutantscan.csv"]
