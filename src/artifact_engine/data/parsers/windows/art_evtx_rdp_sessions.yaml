id: art_evtx_rdp_sessions
name: "EVTX: RDP sessions"
description: "TerminalServices-LocalSessionManager events 21-25, 39 and 40: RDP session logon, logoff, disconnect and reconnect. EvtxECmd."
source: "TerminalServices-LocalSessionManager"
kind: artifact
os: windows
category: eventlogs
requires: ["Windows/System32/winevt/Logs/Microsoft-Windows-TerminalServices-LocalSessionManager%4Operational.evtx"]
provides: [evtx_rdp_session_csv]
tool:
  binary: EvtxECmd/EvtxECmd.exe
  source:
    url: "https://download.ericzimmermanstools.com/net/EvtxECmd.zip"
    unpack: true
command:
  - "{binary}"
  - "-f"
  - "{evidence}/Windows/System32/winevt/Logs/Microsoft-Windows-TerminalServices-LocalSessionManager%4Operational.evtx"
  - "--csv"
  - "{out}"
  - "--csvf"
  - "art_evtx_rdp_sessions.csv"
  - "--inc"
  - "21,22,23,24,25,39,40"
timeout: 600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  evtx_rdp_session: ["evtx_rdpSessions.csv"]
