id: art_evtx_security
name: "EVTX: Security"
description: "Security log events"
source: "Security.evtx"
alert: context
os: windows
category: eventlogs
requires: ["Windows/System32/winevt/Logs/Security.evtx"]
provides: [evtx_security_csv]
tool:
  binary: EvtxECmd/EvtxECmd.exe
  source:
    url: "https://download.ericzimmermanstools.com/net9/EvtxECmd.zip"
    unpack: true
command:
  - "{binary}"
  - "-f"
  - "{evidence}/Windows/System32/winevt/Logs/Security.evtx"
  - "--csv"
  - "{out}"
  - "--csvf"
  - "art_evtx_security.csv"
timeout: 1200
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  evtx_security: ["evtx_security.csv"]
