id: art_recyclebin
name: "Recycle Bin"
description: "Deleted-file metadata from $Recycle.Bin $I records (RBCmd)"
source: "$Recycle.Bin"
alert: context
os: windows
category: filesystem
requires: ["$Recycle.Bin"]
provides: [recyclebin_csv]
tool:
  binary: RBCmd.exe
  source:
    url: "https://download.ericzimmermanstools.com/net9/RBCmd.zip"
    unpack: true
command:
  - "{binary}"
  - "-d"
  - "{evidence}/$Recycle.Bin"
  - "-q"
  - "--csv"
  - "{out}"
  - "--csvf"
  - "art_recyclebin.csv"
timeout: 600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  recyclebin: ["recyclebin.csv"]
