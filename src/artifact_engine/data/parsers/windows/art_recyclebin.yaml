id: art_recyclebin
name: "Recycle Bin"
description: "Deleted-file records from $Recycle.Bin ($I files): original path, size and deletion time. RBCmd."
source: "$Recycle.Bin"
kind: artifact
os: windows
category: filesystem
requires: ["$Recycle.Bin"]
provides: [recyclebin_csv]
tool:
  binary: RBCmd.exe
  source:
    url: "https://download.ericzimmermanstools.com/net/RBCmd.zip"
    unpack: true
command:
  - "{binary}"
  - "-d"
  - "{evidence}/$Recycle.Bin"
  - "-q"
  - "--csv"
  - "{out}"
  - "--csvf"
  - "art_recyclebin.csv"
timeout: 600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  recyclebin: ["recyclebin.csv"]
