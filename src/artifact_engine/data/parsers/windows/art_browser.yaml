id: art_browser
name: "Browser history"
description: "Web history and downloads (Chrome/Edge/Brave/Firefox SQLite)"
source: "User profiles (Chrome, Edge, Brave, Firefox)"
alert: context
os: windows
category: browser
requires: ["Users"]
provides: [browser_csv]
handler: "artifact_engine.handlers.win_browser:run"
outputs:
  - path: "{out}/art_browser_history.csv"
    format: csv
  - path: "{out}/art_browser_downloads.csv"
    format: csv
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  browser: ["browser_downloads.csv", "browser_history.csv"]
