id: alert_mem_hollowprocesses
name: "Memory: hollowprocesses (Volatility 3)"
description: "Processes whose main image in memory does not match the file it was loaded from (process hollowing). Fields: PID, Process, Notes. Volatility 3 `windows.malware.hollowprocesses`."
source: "Memory image"
kind: alert
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:hollowprocesses"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
# v0.7.187: every row is a finding, so the table is alert_.
replaces:
  mem_hollowprocesses: ["mem_hollowprocesses.csv"]
  art_mem_hollowprocesses: ["art_mem_hollowprocesses.csv"]
