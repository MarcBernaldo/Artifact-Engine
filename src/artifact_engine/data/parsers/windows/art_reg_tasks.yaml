id: art_reg_tasks
name: "Registry: Scheduled Tasks"
description: "Scheduled tasks registered in the SOFTWARE hive TaskCache, as RECmd key and value rows."
source: "SOFTWARE hive (TaskCache)"
kind: artifact
os: windows
category: registry
requires: ["Windows/System32/config/SOFTWARE"]
provides: [reg_scheduledtasks_csv]
tool:
  binary: RECmd/RECmd.exe
  source:
    url: "https://download.ericzimmermanstools.com/net/RECmd.zip"
    unpack: true
command:
  - "{binary}"
  - "-d"
  - "{evidence}/Windows/System32/config"
  - "--bn"
  - "{assets}/recmd/ScheduledTasks.reb"
  - "--csv"
  - "{out}"
  - "--csvf"
  - "art_reg_tasks.csv"
timeout: 600
# A dirty hive with no transaction logs beside it aborts the run; --nl true
# allows them to be absent (present ones are still replayed).
retry:
  when: "no transaction logs were found"
  add: ["--nl", "true"]
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  reg_scheduledtasks: ["reg_tsch.csv"]
