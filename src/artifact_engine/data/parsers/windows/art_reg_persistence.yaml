id: art_reg_persistence
name: "Registry persistence (ASEPs)"
description: "Auto-start locations read from the hives: Run and RunOnce (SOFTWARE and every NTUSER.DAT), Winlogon Userinit and Shell, AppInit and AppCert DLLs, IFEO debuggers, LSA packages, BootExecute, Command Processor AutoRun, netsh helpers, time providers, per-user COM hijacks, logon scripts and Active Setup. Run keys are listed in full; flags a command from a staging folder or a download cradle, and any fixed-default location that deviates."
source: "SOFTWARE + NTUSER.DAT + UsrClass"
kind: artifact
os: windows
category: detections
handler: "artifact_engine.handlers.win_persistence:run"
requires: ["Windows/System32/config/SOFTWARE"]
provides: [persistence_csv]
outputs:
  - path: "{out}/art_reg_persistence.csv"
    format: csv
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  reg_persistence: ["persistence.csv"]
