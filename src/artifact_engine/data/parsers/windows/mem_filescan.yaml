id: mem_filescan
name: "Memory: filescan (Volatility 3)"
description: "File objects carved from the image: every file some process had opened, by path. Volatility 3 `windows.filescan.FileScan` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["mem_info"]
handler: "artifact_engine.handlers.mem_volatility:filescan"
timeout: 3600
