id: art_pca_general
name: "PCA run database"
description: "The Program Compatibility Assistant's run records (Windows 11 22H2+): one row per run it watched, from PcaGeneralDb0.txt and PcaGeneralDb1.txt -- run time (same unstated zone as PcaAppLaunchDic, hence _local), run status, path as written (may start with %USERPROFILE%), description, vendor, version, Amcache ProgramId and exit code. The field order is the community's, not Microsoft's: a line that does not split into its 8 fields is kept whole in `extra`, and counted in a warning."
source: "PcaGeneralDb0.txt / PcaGeneralDb1.txt (Windows 11)"
alert: context
os: windows
category: execution
requires: ["Windows/appcompat/pca"]
provides: [pca_general_csv]
handler: "artifact_engine.handlers.win_pca:run_general"
outputs:
  - path: "{out}/art_pca_general.csv"
    format: csv
