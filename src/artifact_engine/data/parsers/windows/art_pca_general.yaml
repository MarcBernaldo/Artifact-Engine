id: art_pca_general
name: "PCA run database"
description: "Program Compatibility Assistant run records (PcaGeneralDb0/1.txt, Windows 11 22H2+), one row per run: time, status, path as written, description, vendor, version, Amcache ProgramId and exit code. A line that does not split into eight fields is kept in extra and counted."
source: "PcaGeneralDb0.txt / PcaGeneralDb1.txt (Windows 11)"
kind: artifact
os: windows
category: execution
requires: ["Windows/appcompat/pca"]
provides: [pca_general_csv]
handler: "artifact_engine.handlers.win_pca:run_general"
outputs:
  - path: "{out}/art_pca_general.csv"
    format: csv
