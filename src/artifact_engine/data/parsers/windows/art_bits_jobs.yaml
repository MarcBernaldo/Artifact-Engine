id: art_bits_jobs
name: "BITS transfer jobs"
description: "BITS transfer jobs from qmgr.db (ESE) or qmgr*.dat: remote URL and local destination per job, a download and persistence channel that blends in with Windows Update. Flags a raw-IP host, an ftp URL, and an executable or script saved outside browser and update folders."
source: "qmgr.db / qmgr*.dat (BITS)"
kind: artifact
os: windows
category: network
handler: "artifact_engine.handlers.win_bits:run"
requires: ["ProgramData/Microsoft/Network/Downloader"]
provides: [bits_csv]
outputs:
  - path: "{out}/art_bits_jobs.csv"
    format: csv
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  bits: ["bits_jobs.csv"]
