id: art_mem_netscan
name: "Memory: netscan (Volatility 3)"
description: "Network connections and listeners carved from memory, closed ones included, with the owning process. Volatility 3 `windows.netscan.NetScan` over the unit's memory image."
source: "Memory image"
alert: context
os: windows
category: memory
requires: ["memory.image"]
# after art_mem_info, which resolves the kernel's symbols once for the unit
depends_on: ["art_mem_info"]
handler: "artifact_engine.handlers.mem_volatility:netscan"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  mem_netscan: ["mem_netscan.csv"]
