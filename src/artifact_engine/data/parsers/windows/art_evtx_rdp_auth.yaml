id: art_evtx_rdp_auth
name: "EVTX: RDP auth"
description: "TerminalServices-RemoteConnectionManager events 1149 and 1148: RDP network authentication, with user and source address. EvtxECmd."
source: "TerminalServices-RemoteConnectionManager"
kind: artifact
os: windows
category: eventlogs
requires: ["Windows/System32/winevt/Logs/Microsoft-Windows-TerminalServices-RemoteConnectionManager%4Operational.evtx"]
provides: [evtx_rdp_auth_csv]
tool:
  binary: EvtxECmd/EvtxECmd.exe
  source:
    url: "https://download.ericzimmermanstools.com/net/EvtxECmd.zip"
    unpack: true
command:
  - "{binary}"
  - "-f"
  - "{evidence}/Windows/System32/winevt/Logs/Microsoft-Windows-TerminalServices-RemoteConnectionManager%4Operational.evtx"
  - "--csv"
  - "{out}"
  - "--csvf"
  - "art_evtx_rdp_auth.csv"
  - "--inc"
  - "1149,1148"
timeout: 600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  evtx_rdp_auth: ["evtx_rdpAuth.csv"]
