id: alert_groups_linux
name: "Alerts by artifact"
description: "The detections that read one artifact, gathered in one table per artifact with a common shape (alert, severity, subject, time_utc, detail, source_table): alerts_bodyfile (collection staging) and alerts_shell (flagged shell history lines and GTFOBins abuse). The source tables are untouched."
source: "The detection tables of this machine"
alert: flag
os: linux
category: detections
depends_on: ["collection_artifacts_bodyfile",
             "shell_history", "gtfobins"]
handler: "artifact_engine.handlers.lin_alert_groups:run"
