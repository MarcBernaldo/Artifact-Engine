id: linmem_envars
name: "Linux memory: envars (Volatility 3)"
description: "The environment of every process (also what names the unit: HOSTNAME, or the host in SESSION_MANAGER). Volatility 3 `linux.envars.Envars` over the unit's Linux memory image."
source: "Memory image"
alert: context
os: linux
category: memory
requires: ["memory.image"]
# after linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["linmem_info"]
handler: "artifact_engine.handlers.mem_linux:envars"
timeout: 3600
