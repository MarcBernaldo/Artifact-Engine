id: art_shell_history
name: "Shell history"
description: "Shell history of every account (bash, zsh, sh, ash, fish) from /home, /root and every home /etc/passwd names, in on-disk order, with the time of each command where the shell recorded it. The flag column marks named offensive tools from suspicious_tools.txt."
source: "Each user's shell history (bash, zsh, sh, ash, fish), every home /etc/passwd names"
kind: artifact
os: linux
category: shell
provides: [shell_history_csv]
handler: "artifact_engine.handlers.lin_bash:run"
outputs:
  - path: "{out}/art_shell_history.csv"
    format: csv
# v0.7.158: renamed from `bash`, so the id is the table it writes
replaces:
  shell_history: ["shell_history.csv"]
  bash: ["bash.csv"]
