id: linmem_tty_check
name: "Linux memory: tty_check (Volatility 3)"
description: "Terminal device handlers and the function behind each: one outside the kernel is a hook on what is typed. Volatility 3 `linux.malware.tty_check.Tty_Check` over the unit's Linux memory image."
source: "Memory image"
alert: detect
os: linux
category: memory
requires: ["memory.image"]
# after linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["linmem_info"]
handler: "artifact_engine.handlers.mem_linux:tty_check"
timeout: 3600
