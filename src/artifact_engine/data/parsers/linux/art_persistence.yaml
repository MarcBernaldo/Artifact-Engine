id: art_persistence
name: "Persistence"
description: "Persistence locations: systemd units, init.d, rc.local, shell profiles, autostart, ld.so.preload and ld.so.conf.d, sudoers, motd, PAM, kernel modules, apt hooks, sshd settings (keys, root login, empty passwords), ~/.ssh/rc and sshrc, udev RUN/PROGRAM rules, systemd generators and NetworkManager dispatcher scripts. Flags fetch-and-run, reverse shells, execution from world-writable directories, preloading, NOPASSWD grants and non-standard PAM modules."
source: "/etc and the home directories /etc/passwd names"
kind: artifact
os: linux
category: persistence
requires: ["[root]/etc"]
provides: [persistence_csv]
handler: "artifact_engine.handlers.lin_persistence:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  persistence: ["persistence.csv"]
