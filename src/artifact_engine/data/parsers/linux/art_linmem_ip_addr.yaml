id: art_linmem_ip_addr
name: "Linux memory: ip addr (Volatility 3)"
description: "Network interfaces with their addresses, as `ip addr` shows them, and whether each is promiscuous. Volatility 3 `linux.ip.Addr` over the unit's Linux memory image."
source: "Memory image"
alert: context
os: linux
category: memory
requires: ["memory.image"]
# after art_linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["art_linmem_info"]
handler: "artifact_engine.handlers.mem_linux:ip_addr"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  linmem_ip_addr: ["linmem_ip_addr.csv"]
