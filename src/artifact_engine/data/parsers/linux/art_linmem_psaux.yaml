id: art_linmem_psaux
name: "Linux memory: psaux (Volatility 3)"
description: "Every process with its full command line, as `ps aux` would print it. Volatility 3 `linux.psaux.PsAux` over the unit's Linux memory image."
source: "Memory image"
alert: context
os: linux
category: memory
requires: ["memory.image"]
# after art_linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["art_linmem_info"]
handler: "artifact_engine.handlers.mem_linux:psaux"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  linmem_psaux: ["linmem_psaux.csv"]
