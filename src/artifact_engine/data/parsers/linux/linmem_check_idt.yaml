id: linmem_check_idt
name: "Linux memory: check_idt (Volatility 3)"
description: "The interrupt descriptor table and the function behind each entry: one outside the kernel is a hook. Volatility 3 `linux.malware.check_idt.Check_idt` over the unit's Linux memory image."
source: "Memory image"
alert: detect
os: linux
category: memory
requires: ["memory.image"]
# after linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["linmem_info"]
handler: "artifact_engine.handlers.mem_linux:check_idt"
timeout: 3600
