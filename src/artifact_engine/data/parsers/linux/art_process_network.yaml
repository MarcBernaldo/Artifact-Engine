id: art_process_network
name: "Process network"
description: "Process and socket table from the live response: one row per socket (ss, or netstat) with the owning process, and one per process without sockets, with exe, command line, user, start time, MD5/SHA1, parent, and the remote address's scope and offline origin (country, ASN, Tor). Same columns as the Windows and memory process_network tables."
source: "UAC live_response/network + live_response/process + hash_executables"
kind: artifact
os: linux
category: network
# the process table: a collection without the network commands still has one
requires: ["live_response"]
provides: [process_network_csv]
handler: "artifact_engine.handlers.lin_process_network:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  process_network: ["process_network.csv"]
