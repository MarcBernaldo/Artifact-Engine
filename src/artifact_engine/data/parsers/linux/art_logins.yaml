id: art_logins
name: "Logins (wtmp, btmp, lastlog)"
description: "Every login record: wtmp (logins, logouts, boots) and btmp (failed logins) with every rotation, last/lastb text where the binary file gave none, and the latest login per account from lastlog. Fields: timestamp_utc, timestamp_local, end_local, result, type, user, tty, source_address, source, source_file. Feeds the lateral-movement graph."
source: "/var/log/wtmp, /var/log/btmp and their rotations; UAC live_response/system (last, lastb, lastlog)"
kind: artifact
os: linux
category: eventlogs
provides: [logins_csv]
handler: "artifact_engine.handlers.lin_logins:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  logins: ["logins.csv"]
