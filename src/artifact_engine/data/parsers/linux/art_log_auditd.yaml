id: art_log_auditd
name: "auditd events"
description: "auditd records from every rotation: logins and authentications with source address, decoded sudo commands, account changes, audit-rule hits with command line and cwd, keystrokes where pam_tty_audit is on, SELinux/AppArmor denials and kernel anomalies, each with the auid that survives su and sudo. No flags."
source: "/var/log/audit/audit.log and rotations"
kind: artifact
os: linux
category: eventlogs
requires: ["[root]/var/log/audit"]
provides: [auditd_events_csv]
handler: "artifact_engine.handlers.lin_auditd:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  auditd_events: ["auditd_events.csv"]
