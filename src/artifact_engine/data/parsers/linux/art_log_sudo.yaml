id: art_log_sudo
name: "Sudo command log (/var/log/sudo.log)"
description: "Every sudo invocation where sudoers logs to a file: user, target user, TTY, cwd and command, plus denials (command not allowed, not in sudoers, wrong password), every rotation. Flags sudo runs from staging directories and password or sudoers probing."
source: "A sudo log file, where sudoers configures one"
kind: artifact
os: linux
category: eventlogs
handler: "artifact_engine.handlers.lin_sudo:run"
requires: ["[root]/var/log"]
provides: [sudo_log_csv]
outputs:
  - path: "{out}/art_log_sudo.csv"
    format: csv
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  sudo_log: ["sudo_log.csv"]
