id: alert_yara_linux
name: "YARA scan"
description: "YARA matches in staging directories (/tmp, /var/tmp, /dev/shm, web roots, homes, /root, /usr/local/bin and sbin) and in the binaries UAC recovered from /proc/<pid>/exe, the only copy of a payload that deleted itself. Bundled webshell, reverse-shell, miner and dropper rules. Fields: rule, tags, path, size, strings, score, author, description, reference, suspicious."
source: "Staging directories, and the binaries rescued from /proc"
kind: alert
os: linux
category: detections
provides: [yara_csv]
handler: "artifact_engine.handlers.lin_yara:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  yara: ["yara.csv"]
