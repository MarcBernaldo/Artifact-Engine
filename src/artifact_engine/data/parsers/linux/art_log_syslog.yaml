id: art_log_syslog
name: "Syslog and journal (all lines)"
description: "Every line of every syslog-format file under /var/log (chosen by content), every rotation, and every systemd journal entry (persistent, volatile, archived), merged by time; a journal entry already in a syslog file is dropped. Fields: time (logged and UTC), host, program, pid, message, source, source_file, plus journal boot, uid, process, unit, priority, transport. No flags."
source: "/var/log syslog-format files and rotations; /var/log/journal, /run/log/journal"
kind: artifact
os: linux
category: eventlogs
provides: [syslog_csv]
handler: "artifact_engine.handlers.lin_syslog:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  syslog: ["syslog.csv"]
