id: art_process_identity
name: "Process identity"
description: "Each running process seen three ways: argv (its claim), comm (the kernel's name, which it can set) and the exe link (which it cannot). Flags argv[0] posing as a kernel thread, a comm explained by neither exe nor argv, a deleted binary, and a UID missing from /etc/passwd, except in containers, for directory-backed accounts and for systemd dynamic UIDs (61184-65519)."
source: "UAC live_response/process/proc/<pid>"
kind: artifact
os: linux
category: processes
handler: "artifact_engine.handlers.lin_proc_identity:run"
requires: ["live_response/process/proc"]
provides: [process_identity_csv]
outputs:
  - path: "{out}/art_process_identity.csv"
    format: csv
# v0.7.158: renamed from `proc_identity`, so the id is the table it writes
replaces:
  process_identity: ["process_identity.csv"]
  proc_identity: ["proc_identity.csv"]
