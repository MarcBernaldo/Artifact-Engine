id: art_process_identity
name: "Process identity"
description: "Cross-checks the three independent answers to what a running process is -- argv (the process's claim), comm (the kernel's name, which the process can still set) and the exe symlink (which it cannot) -- from live_response/process/proc/<pid>/. Flags argv[0] dressed as a kernel thread, a comm explained by neither the exe nor the command line, a deleted binary, and a UID with no entry in /etc/passwd (recorded but not suspicious inside a container, whose image brings its own users -- the `container` column names the runtime from ps -axo pid,user,cgroup, or for a process ps missed its nearest listed parent's -- nor where nsswitch takes accounts from a directory, or, where it names systemd, for the dynamic UIDs 61184-65519). One row per process: the join itself is the artifact."
source: "UAC live_response/process/proc/<pid>"
alert: flag
os: linux
category: processes
handler: "artifact_engine.handlers.lin_proc_identity:run"
requires: ["live_response/process/proc"]
provides: [process_identity_csv]
outputs:
  - path: "{out}/art_process_identity.csv"
    format: csv
# v0.7.158: renamed from `proc_identity`, so the id is the table it writes
replaces:
  process_identity: ["process_identity.csv"]
  proc_identity: ["proc_identity.csv"]
