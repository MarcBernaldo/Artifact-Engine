id: art_web_metrics
name: "Web access metrics"
description: "Security-audit aggregations over the access logs in the web_metrics.html panel: per-IP stats (volume/status/odd methods/payload hits), the 404 ranking and the 401/403 clusters. No table of its own (the per-IP one was web_ip_stats until v0.7.170)"
source: "Web access logs"
alert: context
os: linux
category: web
provides: [web_metrics_csv]
# Takes its requests from art_web_access.csv, the one parse pass over this
# volume's access logs, and falls back to the raw logs when that is not
# there (v0.7.87).
depends_on: ["art_web_access"]
handler: "artifact_engine.handlers.lin_web_metrics:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  web_metrics: []
