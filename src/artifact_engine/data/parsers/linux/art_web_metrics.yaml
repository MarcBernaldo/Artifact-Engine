id: art_web_metrics
name: "Web access metrics"
description: "Aggregations over the access logs for the web_metrics.html dashboard: per-IP volume, status codes, unusual methods and payload hits, the 404 ranking and the 401/403 clusters. Writes no table."
source: "Web access logs"
kind: artifact
os: linux
category: web
provides: [web_metrics_csv]
# Takes its requests from art_web_access.csv, the one parse pass over this
# volume's access logs, and falls back to the raw logs when that is not
# there (v0.7.87).
depends_on: ["art_web_access"]
handler: "artifact_engine.handlers.lin_web_metrics:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  web_metrics: []
