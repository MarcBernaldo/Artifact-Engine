id: shell_history
name: "Shell history"
description: "Per-user shell history (bash, zsh, sh, ash, fish) from /home, /root and every other home /etc/passwd names (service accounts), with the time each command ran where the shell recorded it (HISTTIMEFORMAT, zsh extended history)"
source: "Each user's shell history (bash, zsh, sh, ash, fish), every home /etc/passwd names"
alert: flag
os: linux
category: shell
provides: [shell_history_csv]
handler: "artifact_engine.handlers.lin_bash:run"
outputs:
  - path: "{out}/shell_history.csv"
    format: csv
# v0.7.158: renamed from `bash`, so the id is the table it writes
replaces:
  bash: ["bash.csv"]
