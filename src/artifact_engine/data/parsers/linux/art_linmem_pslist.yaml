id: art_linmem_pslist
name: "Linux memory: pslist (Volatility 3)"
description: "Tasks on the kernel's task list: PID, thread, parent, command, user and group ids, start time. Volatility 3 `linux.pslist.PsList` over the unit's Linux memory image."
source: "Memory image"
alert: context
os: linux
category: memory
requires: ["memory.image"]
# after art_linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["art_linmem_info"]
handler: "artifact_engine.handlers.mem_linux:pslist"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  linmem_pslist: ["linmem_pslist.csv"]
