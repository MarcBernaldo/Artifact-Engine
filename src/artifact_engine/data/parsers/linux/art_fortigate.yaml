id: art_fortigate
name: "FortiGate log timeline"
description: "FortiOS traffic, event and UTM logs (key=value syslog or a FortiAnalyzer CSV export) as one timeline, timestamp_utc from eventtime. Flags UTM blocks and high-risk detections, administrator logins, failed authentications and SSL-VPN sessions."
source: "A loose fortigate[-label] folder (syslog, or a FortiAnalyzer CSV export)"
kind: artifact
os: linux
category: network
handler: "artifact_engine.handlers.lin_fortigate:run"
provides: [fortigate_csv]
outputs:
  - path: "{out}/art_fortigate.csv"
    format: csv
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  fortigate: ["fortigate.csv"]
