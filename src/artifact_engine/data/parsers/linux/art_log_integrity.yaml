id: art_log_integrity
name: "Log integrity"
description: "Anti-forensics check of /var/log: emptied security logs and truncated binary login logs, with which expected logs are present or missing. Flags emptied and truncated logs."
source: "/var/log"
kind: artifact
os: linux
category: systeminfo
requires: ["[root]/var/log"]
provides: [log_integrity_csv]
handler: "artifact_engine.handlers.lin_log_integrity:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  log_integrity: ["log_integrity.csv"]
