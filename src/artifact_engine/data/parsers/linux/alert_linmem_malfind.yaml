id: alert_linmem_malfind
name: "Linux memory: malfind (Volatility 3)"
description: "Process memory that is writable, executable and not file-backed: injected code, with its first bytes and their disassembly. JIT runtimes (browsers, Java, .NET) also appear. Fields: PID, Process, Start, End, Path, Protection, Hexdump, Disasm. Volatility 3 `linux.malware.malfind`."
source: "Memory image"
kind: alert
os: linux
category: memory
requires: ["memory.image"]
# after art_linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["art_linmem_info"]
handler: "artifact_engine.handlers.mem_linux:malfind"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
# v0.7.187: every row is a finding, so the table is alert_.
replaces:
  linmem_malfind: ["linmem_malfind.csv"]
  art_linmem_malfind: ["art_linmem_malfind.csv"]
