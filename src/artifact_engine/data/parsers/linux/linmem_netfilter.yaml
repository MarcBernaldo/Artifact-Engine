id: linmem_netfilter
name: "Linux memory: netfilter (Volatility 3)"
description: "Netfilter hooks and the function each calls, marked when that function is outside the kernel and its known modules (a rootkit's packet filter). Volatility 3 `linux.malware.netfilter.Netfilter` over the unit's Linux memory image."
source: "Memory image"
alert: detect
os: linux
category: memory
requires: ["memory.image"]
# after linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["linmem_info"]
handler: "artifact_engine.handlers.mem_linux:netfilter"
timeout: 3600
