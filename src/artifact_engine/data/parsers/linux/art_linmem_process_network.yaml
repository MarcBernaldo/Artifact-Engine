id: art_linmem_process_network
name: "Linux memory: process network"
description: "Process and socket table built from the Linux memory tables: one row per IPv4/IPv6 socket with the owning process, and one per process without sockets, with binary, command line, uid, start time, parent, and the remote address's scope and offline origin (country, ASN, Tor). Same columns as the Windows and live-response process_network tables."
source: "Memory image (Volatility tables)"
kind: artifact
os: linux
category: memory
requires: ["memory.image"]
depends_on: ["art_linmem_pslist", "art_linmem_psaux", "art_linmem_process_spoofing", "art_linmem_sockstat"]
provides: [process_network_csv]
handler: "artifact_engine.handlers.mem_linux_network:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  linmem_process_network: ["linmem_process_network.csv", "process_network.csv"]
