id: alert_gtfobins
name: "GTFOBins abuse in shell history"
description: "Shell-history lines that use a GTFOBins technique: a shell escape, reverse shell or privilege escalation through find, awk, vim, tar, python and similar. Only the exploiting fragment matches, so ordinary use stays quiet; sudo marks escalation to root. Fields: user, shell, id, binary, function, sudo, command_line."
source: "Shell histories"
kind: alert
os: linux
category: detections
handler: "artifact_engine.handlers.lin_gtfobins:run"
provides: [gtfobins_csv]
outputs:
  - path: "{out}/alert_gtfobins.csv"
    format: csv
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  gtfobins: ["gtfobins.csv"]
