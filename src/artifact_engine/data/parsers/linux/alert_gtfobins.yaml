id: alert_gtfobins
name: "GTFOBins history abuse (GTFOBins)"
description: "Flags GTFOBins-style abuse in shell history -- the exact invocation that turns find/awk/vim/tar/python/... into a shell escape, reverse shell or privesc (e.g. `find -exec sh`, `awk 'BEGIN{system()}'`, `vim -c ':!'`, `tar --checkpoint-action=exec`, `python -c pty.spawn`). Only the exploitation fragment matches, so a plain `find`/`sudo vim file` stays quiet; the sudo column marks root privesc. Idioms curated from GTFOBins."
source: "Shell histories"
alert: detect
os: linux
category: detections
handler: "artifact_engine.handlers.lin_gtfobins:run"
provides: [gtfobins_csv]
outputs:
  - path: "{out}/alert_gtfobins.csv"
    format: csv
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  gtfobins: ["gtfobins.csv"]
