id: art_linmem_process_spoofing
name: "Linux memory: process_spoofing (Volatility 3)"
description: "Every process with its executable path, command line and comm, marking a name or command line that disagrees with the binary, or a binary deleted after start. Volatility 3 `linux.malware.process_spoofing`."
source: "Memory image"
kind: artifact
os: linux
category: memory
requires: ["memory.image"]
# after art_linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["art_linmem_info"]
handler: "artifact_engine.handlers.mem_linux:process_spoofing"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  linmem_process_spoofing: ["linmem_process_spoofing.csv"]
