id: art_recovered_exe
name: "Recovered process binaries"
description: "Hashes of the executables UAC copied from /proc/<pid>/exe, including ones already deleted from disk, with the owning process (pid, process, argv0, path) and the file size; `aeng sweep -q <size>` finds the same binary on other machines."
source: "UAC live_response/process/proc (the binaries rescued from /proc)"
kind: artifact
os: linux
category: detections
handler: "artifact_engine.handlers.lin_recovered_exe:run"
requires: ["live_response/process/proc"]
provides: [recovered_exe_csv]
outputs:
  - path: "{out}/art_recovered_exe.csv"
    format: csv
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  recovered_exe: ["recovered_exe.csv"]
