id: linmem_psaux
name: "Linux memory: psaux (Volatility 3)"
description: "Every process with its full command line, as `ps aux` would print it. Volatility 3 `linux.psaux.PsAux` over the unit's Linux memory image."
source: "Memory image"
alert: context
os: linux
category: memory
requires: ["memory.image"]
# after linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["linmem_info"]
handler: "artifact_engine.handlers.mem_linux:psaux"
timeout: 3600
