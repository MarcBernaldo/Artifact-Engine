id: linmem_pagecache
name: "Linux memory: pagecache (Volatility 3)"
description: "Files with pages in the page cache, by path, with inode times and sizes: what the system had open or read recently, deleted files included. Volatility 3 `linux.pagecache.Files` over the unit's Linux memory image."
source: "Memory image"
alert: context
os: linux
category: memory
requires: ["memory.image"]
# after linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["linmem_info"]
handler: "artifact_engine.handlers.mem_linux:pagecache"
timeout: 3600
