id: art_log_auth
name: "Authentication events"
description: "SSH logins (accepted, failed, invalid user), sudo, su and account creation from the auth logs and their rotations, or the systemd journal when there are none. Flags an account creation, and the first SSH login accepted from a source after five failures from it."
source: "/var/log auth.log / secure / messages, and their rotations; the systemd journal when none exists"
kind: artifact
os: linux
category: eventlogs
requires: ["[root]/var/log"]
provides: [auth_log_csv]
handler: "artifact_engine.handlers.lin_auth:run"
# v0.7.158: renamed from `auth`, so the id is the table it writes
replaces:
  auth_log: ["auth_log.csv"]
  auth: ["auth.csv"]
