id: alert_log_sigma
name: "Sigma detections (Linux)"
description: "SigmaHQ Linux ruleset (pysigma) over the raw auditd and syslog logs, and its process_creation rules also over what the host ran: every command of the users' shell histories and every process UAC's ps captured (the `source` column says which). One row per rule, source and distinct match, with its count."
source: "/var/log (raw auditd and syslog), shell histories, live_response ps"
alert: detect
os: linux
category: detections
requires: ["[root]/var/log"]
provides: [log_sigma_csv]
handler: "artifact_engine.handlers.lin_sigma:run"
# v0.7.158: renamed from `sigma`, so the id is the table it writes
replaces:
  log_sigma: ["log_sigma.csv"]
  sigma: ["sigma_detections.csv"]
