id: alert_log_sigma
name: "Sigma detections (Linux)"
description: "SigmaHQ Linux rules over the raw auditd and syslog logs; the process_creation rules also over every shell-history command and every process UAC's ps captured. One row per rule, source and distinct match. Fields: level, rule, source, mitre, first_seen, last_seen, count, match, rule_id."
source: "/var/log (raw auditd and syslog), shell histories, live_response ps"
kind: alert
os: linux
category: detections
requires: ["[root]/var/log"]
provides: [log_sigma_csv]
handler: "artifact_engine.handlers.lin_sigma:run"
# v0.7.158: renamed from `sigma`, so the id is the table it writes
replaces:
  log_sigma: ["log_sigma.csv"]
  sigma: ["sigma_detections.csv"]
