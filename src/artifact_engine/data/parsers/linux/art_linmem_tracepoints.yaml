id: art_linmem_tracepoints
name: "Linux memory: tracepoints (Volatility 3)"
description: "Probes attached to kernel tracepoints and the module behind each. Empty when there are none. Volatility 3 `linux.tracing.tracepoints.CheckTracepoints` over the unit's Linux memory image."
source: "Memory image"
alert: detect
os: linux
category: memory
requires: ["memory.image"]
# after art_linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["art_linmem_info"]
handler: "artifact_engine.handlers.mem_linux:tracepoints"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  linmem_tracepoints: ["linmem_tracepoints.csv"]
