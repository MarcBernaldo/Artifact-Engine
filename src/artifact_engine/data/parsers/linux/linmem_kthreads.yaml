id: linmem_kthreads
name: "Linux memory: kthreads (Volatility 3)"
description: "Kernel threads and the function each runs, with the module it belongs to: a thread whose handler is in no known module is suspect. Volatility 3 `linux.kthreads.Kthreads` over the unit's Linux memory image."
source: "Memory image"
alert: flag
os: linux
category: memory
requires: ["memory.image"]
# after linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["linmem_info"]
handler: "artifact_engine.handlers.mem_linux:kthreads"
timeout: 3600
