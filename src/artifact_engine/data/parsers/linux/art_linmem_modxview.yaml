id: art_linmem_modxview
name: "Linux memory: modxview (Volatility 3)"
description: "Kernel modules seen through procfs, sysfs and a memory scan side by side: a module missing from one view is hidden. Volatility 3 `linux.malware.modxview.Modxview` over the unit's Linux memory image."
source: "Memory image"
alert: detect
os: linux
category: memory
requires: ["memory.image"]
# after art_linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["art_linmem_info"]
handler: "artifact_engine.handlers.mem_linux:modxview"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  linmem_modxview: ["linmem_modxview.csv"]
