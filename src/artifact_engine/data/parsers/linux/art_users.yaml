id: art_users
name: "Users (passwd)"
description: "Local accounts from /etc/passwd with groups, privileged-group membership, password status and last password change from /etc/shadow (never the hash). Flags a UID 0 account other than root and an account with no password."
source: "/etc/passwd"
kind: artifact
os: linux
category: systeminfo
requires: ["[root]/etc/passwd"]
provides: [users_csv]
handler: "artifact_engine.handlers.lin_users:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  users: ["users.csv"]
