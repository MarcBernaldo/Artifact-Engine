id: art_linmem_capabilities
name: "Linux memory: capabilities (Volatility 3)"
description: "The capability sets of every task (effective, permitted, inheritable, bounding, ambient). Volatility 3 `linux.capabilities.Capabilities` over the unit's Linux memory image."
source: "Memory image"
alert: context
os: linux
category: memory
requires: ["memory.image"]
# after art_linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["art_linmem_info"]
handler: "artifact_engine.handlers.mem_linux:capabilities"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  linmem_capabilities: ["linmem_capabilities.csv"]
