id: art_web_access
name: "Web access timeline"
description: "Every Apache/nginx access log (current, rotated, per virtual host) as one request timeline, plus mod_ssl request-log rows with TLS protocol and cipher."
source: "Web access logs (/var/log, plus any the server config names elsewhere, or a weblogs folder)"
kind: artifact
os: linux
category: web
provides: [web_access_csv]
handler: "artifact_engine.handlers.lin_web_access:run"
# v0.7.154-155 wrote ssl_request_log to a table of its own; it is in art_web_access since v0.7.156
replaces:
  web_access: ["web_access.csv"]
  web_ssl_requests: ["web_ssl_requests.csv"]
