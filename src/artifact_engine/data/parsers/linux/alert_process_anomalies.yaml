id: alert_process_anomalies
name: "Process anomalies"
description: "Running processes that suggest a rootkit or fileless malware: an executable in memfd or a temporary directory, or a temporary working directory, noting a process hidden from ps. EDR and collector processes are excluded. Fields: kind, pid, user, detail, suspicious."
source: "UAC live_response/process"
kind: alert
os: linux
category: processes
requires: ["live_response/process"]
provides: [process_anomalies_csv]
handler: "artifact_engine.handlers.lin_proc_anomalies:run"
# v0.7.158: renamed from `proc_anomalies`, so the id is the table it writes
replaces:
  process_anomalies: ["process_anomalies.csv"]
  proc_anomalies: ["proc_anomalies.csv"]
