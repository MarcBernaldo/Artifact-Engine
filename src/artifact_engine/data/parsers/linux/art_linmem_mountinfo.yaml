id: art_linmem_mountinfo
name: "Linux memory: mountinfo (Volatility 3)"
description: "Mount points of every mount namespace, with source, type and options. Volatility 3 `linux.mountinfo.MountInfo` over the unit's Linux memory image."
source: "Memory image"
alert: context
os: linux
category: memory
requires: ["memory.image"]
# after art_linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["art_linmem_info"]
handler: "artifact_engine.handlers.mem_linux:mountinfo"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  linmem_mountinfo: ["linmem_mountinfo.csv"]
