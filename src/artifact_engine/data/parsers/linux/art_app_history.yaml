id: art_app_history
name: "Interactive-tool histories"
description: "What users did in interactive tools other than the shell: vim files, searches and : commands (with times on vim 8+), less searches and ! commands, hosts in .wget-hsts, and python, mysql, psql, sqlite3, redis-cli, node and mongo histories. Flags named offensive tools, and sensitive files, logs or shell histories opened in vim."
source: "Each user's .viminfo, .lesshst, .wget-hsts and REPL/database-client histories"
kind: artifact
os: linux
category: shell
provides: [app_history_csv]
handler: "artifact_engine.handlers.lin_app_history:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  app_history: ["app_history.csv"]
