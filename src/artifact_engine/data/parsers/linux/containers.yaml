source: "UAC live_response/containers (docker, podman, lxc)"
alert: flag
os: linux
category: containers
requires: ["live_response/containers"]
provides: [containers_csv, container_changes_csv, container_procs_csv]
handler: "artifact_engine.handlers.lin_containers:run"
