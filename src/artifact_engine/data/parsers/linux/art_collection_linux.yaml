id: art_collection_linux
name: "Collection's own copy of the filesystem (bodyfile)"
description: "Directories whose children are a filesystem root: a UAC output tree, an extracted acquisition, a chroot or a container rootfs. Paths under them are second copies of files that live elsewhere, so `aeng sweep` skips them by default and reports how many (`--include-collection` searches them). The evidence column says what identified each one."
source: "UAC bodyfile"
kind: artifact
os: linux
category: filesystem
requires: ["bodyfile/bodyfile.txt"]
depends_on: ["art_bodyfile"]
provides: [collection_artifacts_csv]
handler: "artifact_engine.handlers.lin_collection:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
# v0.7.187: an inventory of copies, not a finding, so the table is art_.
replaces:
  collection_artifacts_bodyfile: ["collection_artifacts.csv"]
  alert_collection_linux: ["alert_collection.csv"]
