id: linmem_psscan
name: "Linux memory: psscan (Volatility 3)"
description: "Task structures carved from memory, exited and unlinked ones included: a process hidden from the task list shows here and not in pslist. Volatility 3 `linux.psscan.PsScan` over the unit's Linux memory image."
source: "Memory image"
alert: context
os: linux
category: memory
requires: ["memory.image"]
# after linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["linmem_info"]
handler: "artifact_engine.handlers.mem_linux:psscan"
timeout: 3600
