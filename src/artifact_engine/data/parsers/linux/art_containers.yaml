id: art_containers
name: "Containers"
description: "Containers from the runtime's own output (docker/podman inspect, diff and top; lxc list and config): inventory, filesystem changes and processes. Flags a privileged or host-namespaced container, a bind mount of the host root or control plane, and writes to staging, web-root or persistence paths."
source: "UAC live_response/containers (docker, podman, lxc)"
kind: artifact
os: linux
category: containers
requires: ["live_response/containers"]
provides: [containers_csv, container_changes_csv, container_procs_csv]
handler: "artifact_engine.handlers.lin_containers:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  containers: ["container_changes.csv", "container_procs.csv", "containers.csv"]
