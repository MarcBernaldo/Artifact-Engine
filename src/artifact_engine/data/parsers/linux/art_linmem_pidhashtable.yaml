id: art_linmem_pidhashtable
name: "Linux memory: pidhashtable (Volatility 3)"
description: "Tasks reached through the kernel's PID hash table, a second list to compare with pslist. Volatility 3 `linux.pidhashtable.PIDHashTable` over the unit's Linux memory image."
source: "Memory image"
alert: context
os: linux
category: memory
requires: ["memory.image"]
# after art_linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["art_linmem_info"]
handler: "artifact_engine.handlers.mem_linux:pidhashtable"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  linmem_pidhashtable: ["linmem_pidhashtable.csv"]
