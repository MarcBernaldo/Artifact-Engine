id: art_linmem_lsof
name: "Linux memory: lsof (Volatility 3)"
description: "Open file descriptors of every process (files, devices, pipes, sockets) with inode times, one row per process and descriptor. Uses the engine's aeng_linux.Lsof, which reads each file table once, or linux.lsof.Lsof when it cannot run."
source: "Memory image"
kind: artifact
os: linux
category: memory
requires: ["memory.image"]
# after art_linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["art_linmem_info"]
handler: "artifact_engine.handlers.mem_linux:lsof"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  linmem_lsof: ["linmem_lsof.csv"]
