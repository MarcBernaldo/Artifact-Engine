id: web_sigma
name: "Sigma detections (Web)"
description: "SigmaHQ webserver ruleset (rules/web) over Apache/nginx access logs, aggregated per rule+source IP and enriched with offline IP origin (country + Tor)"
source: "Web access logs"
alert: detect
os: linux
category: detections
provides: [web_sigma_csv]
# Takes its requests from web_access.csv, the one parse pass over this
# volume's access logs, and falls back to the raw logs when that is not
# there (v0.7.87).
depends_on: ["web_access"]
handler: "artifact_engine.handlers.lin_web_sigma:run"
