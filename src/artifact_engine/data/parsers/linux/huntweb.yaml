id: huntweb
name: "Web attack hunt"
description: "Attack-only view of access logs: payload signatures (log4shell/cmdi/webshell/sqli/lfi/traversal/xss) flagged first, enriched with offline IP origin (country + Tor)"
source: "Web access logs (/var/log, or a weblogs folder)"
alert: detect
os: linux
category: web
provides: [huntweb_csv]
# Takes its requests from web_access.csv, the one parse pass over this
# volume's access logs, and falls back to the raw logs when that is not
# there (v0.7.87).
depends_on: ["web_access"]
handler: "artifact_engine.handlers.lin_huntweb:run"
