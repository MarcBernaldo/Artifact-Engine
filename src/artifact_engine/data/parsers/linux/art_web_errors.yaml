id: art_web_errors
name: "Web error logs"
description: "Every Apache/nginx error log (current, rotated, per virtual host), one row per line: time (local and UTC), level, module, pid, source_ip, message, and the request, server_name, http_host and referer where logged. Unprefixed lines from child processes kept. No flags."
source: "Web server error logs (/var/log/apache2, httpd, nginx, lighttpd, plus any ErrorLog/error_log the server config names elsewhere)"
kind: artifact
os: linux
category: web
provides: [web_errors_csv]
handler: "artifact_engine.handlers.lin_web_errors:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  web_errors: ["web_errors.csv"]
