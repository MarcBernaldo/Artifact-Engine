id: art_linmem_check_idt
name: "Linux memory: check_idt (Volatility 3)"
description: "Interrupt descriptor table entries and the function behind each; an entry outside the kernel is a hook. Volatility 3 `linux.malware.check_idt`."
source: "Memory image"
kind: artifact
os: linux
category: memory
requires: ["memory.image"]
# after art_linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["art_linmem_info"]
handler: "artifact_engine.handlers.mem_linux:check_idt"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  linmem_check_idt: ["linmem_check_idt.csv"]
