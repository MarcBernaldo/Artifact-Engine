id: art_linmem_check_syscall
name: "Linux memory: check_syscall (Volatility 3)"
description: "The system call table, each entry with the function it points to: one outside the kernel is a hook. Volatility 3 `linux.malware.check_syscall.Check_syscall` over the unit's Linux memory image."
source: "Memory image"
alert: detect
os: linux
category: memory
requires: ["memory.image"]
# after art_linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["art_linmem_info"]
handler: "artifact_engine.handlers.mem_linux:check_syscall"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  linmem_check_syscall: ["linmem_check_syscall.csv"]
