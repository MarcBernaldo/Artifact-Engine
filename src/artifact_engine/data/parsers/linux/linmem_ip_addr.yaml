id: linmem_ip_addr
name: "Linux memory: ip addr (Volatility 3)"
description: "Network interfaces with their addresses, as `ip addr` shows them, and whether each is promiscuous. Volatility 3 `linux.ip.Addr` over the unit's Linux memory image."
source: "Memory image"
alert: context
os: linux
category: memory
requires: ["memory.image"]
# after linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["linmem_info"]
handler: "artifact_engine.handlers.mem_linux:ip_addr"
timeout: 3600
