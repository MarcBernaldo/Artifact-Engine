id: alert_exfil_commands_linux
name: "Exfiltration command lines"
description: "Shell-history and ps command lines that match a LOLExfil endpoint pattern (rclone to a cloud remote, curl/scp/nc transfers, DNS exfiltration loops). One row per command line and tool; level is high for an exfiltration action, medium for staging, low for the tool merely running. Fields: level, tool, detect_type, purpose, source, user, command_line, first_seen_utc, last_seen_utc, count, pattern."
source: "Shell histories + UAC live_response/process (ps)"
kind: alert
os: linux
category: detections
provides: [exfil_commands_csv]
handler: "artifact_engine.handlers.lin_exfil_commands:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  exfil_commands_linux: ["exfil_commands.csv"]
