id: art_known_hosts
name: "SSH known_hosts (lateral)"
description: "Hosts each account connected to over SSH, from ~/.ssh/known_hosts and the system file: plaintext entries deduplicated, hashed entries summarised. Feeds the lateral-movement graph. No flags."
source: "Each account's ~/.ssh/known_hosts"
kind: artifact
os: linux
category: network
requires: ["[root]"]
provides: [known_hosts_csv]
handler: "artifact_engine.handlers.lin_known_hosts:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  known_hosts: ["known_hosts.csv"]
