id: art_container_logs
name: "Container logs"
description: "Container stdout and stderr, every rotation in order: Kubernetes pod logs (CRI format) and Docker json-file logs. One row per line: time (UTC), stream, partial, namespace, pod, container, message. No flags."
source: "/var/log/pods, /var/log/containers, /var/lib/docker/containers/*/*-json.log"
kind: artifact
os: linux
category: containers
provides: [container_logs_csv]
handler: "artifact_engine.handlers.lin_container_logs:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  container_logs: ["container_logs.csv"]
