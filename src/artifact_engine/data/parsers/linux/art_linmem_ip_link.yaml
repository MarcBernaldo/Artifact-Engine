id: art_linmem_ip_link
name: "Linux memory: ip link (Volatility 3)"
description: "Network interfaces and their state, as `ip link` shows them. Volatility 3 `linux.ip.Link` over the unit's Linux memory image."
source: "Memory image"
alert: context
os: linux
category: memory
requires: ["memory.image"]
# after art_linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["art_linmem_info"]
handler: "artifact_engine.handlers.mem_linux:ip_link"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  linmem_ip_link: ["linmem_ip_link.csv"]
