id: art_network_config
name: "Network config"
description: "Name resolution and access configuration: /etc/hosts, resolv.conf, hosts.allow and hosts.deny. Flags sinkholes (a real domain mapped to loopback) and update, antivirus or repository domains redirected to another address."
source: "/etc (hosts, resolv.conf, hosts.allow/deny)"
kind: artifact
os: linux
category: systeminfo
requires: ["[root]/etc"]
provides: [network_config_csv]
handler: "artifact_engine.handlers.lin_netconfig:run"
# v0.7.158: renamed from `netconfig`, so the id is the table it writes
replaces:
  network_config: ["network_config.csv"]
  netconfig: ["netconfig.csv"]
