id: users
name: "Users (passwd)"
description: "Local accounts from /etc/passwd, with their groups, password status and the day the password last changed from /etc/shadow (never the hash)"
source: "/etc/passwd"
alert: flag
os: linux
category: systeminfo
requires: ["[root]/etc/passwd"]
provides: [users_csv]
handler: "artifact_engine.handlers.lin_users:run"
