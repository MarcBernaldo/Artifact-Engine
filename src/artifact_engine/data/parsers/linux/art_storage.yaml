id: art_storage
name: "Storage layout"
description: "Every real filesystem the host had, mounted or not (device, type, options, size), and whether the bodyfile covers it. Shows what the filesystem timeline cannot see: network mounts, extra disks, unmounted volumes, and noatime mounts where atime proves nothing."
source: "UAC live_response/storage (mount, df, blkid) + bodyfile"
kind: artifact
os: linux
category: systeminfo
requires: ["live_response/storage/mount.txt"]
provides: [storage_csv]
handler: "artifact_engine.handlers.lin_storage:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  storage: ["storage.csv"]
