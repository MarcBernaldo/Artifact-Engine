id: alert_linmem_check_creds
name: "Linux memory: check_creds (Volatility 3)"
description: "Processes that share one credential structure: a rootkit granting root by copying a pointer. Empty when none do. Fields: CredVA, PIDs. Volatility 3 `linux.malware.check_creds`."
source: "Memory image"
kind: alert
os: linux
category: memory
requires: ["memory.image"]
# after art_linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["art_linmem_info"]
handler: "artifact_engine.handlers.mem_linux:check_creds"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
# v0.7.187: every row is a finding, so the table is alert_.
replaces:
  linmem_check_creds: ["linmem_check_creds.csv"]
  art_linmem_check_creds: ["art_linmem_check_creds.csv"]
