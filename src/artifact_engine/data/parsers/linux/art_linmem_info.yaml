id: art_linmem_info
name: "Linux memory: kernel and boot time (Volatility 3)"
description: "Kernel banner and boot time, plus the Volatility version, image name and size. Runs first and fetches the kernel symbol table (ISF) once for the unit; when it fails, every other Linux memory parser is skipped with the reason."
source: "Memory image"
kind: artifact
os: linux
category: memory
requires: ["memory.image"]
handler: "artifact_engine.handlers.mem_linux:info"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  linmem_info: ["linmem_info.csv"]
