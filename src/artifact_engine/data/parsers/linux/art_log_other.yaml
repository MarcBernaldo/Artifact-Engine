id: art_log_other
name: "Other logs"
description: "Every other text log under /var/log (sssd, snapper, anaconda, YaST2, cloud-init, tuned, vmware-tools, raw package logs...), every rotation, one row per line: timestamp as written, message, source file. Excludes syslog-format files, the journal, auditd, web, container and binary logs. No flags."
source: "/var/log text files that are not syslog-format, outside the directories other parsers own"
kind: artifact
os: linux
category: eventlogs
requires: ["[root]/var/log"]
provides: [other_logs_csv]
handler: "artifact_engine.handlers.lin_other_logs:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  other_logs: ["other_logs.csv"]
