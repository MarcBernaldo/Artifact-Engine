id: art_linmem_ptrace
name: "Linux memory: ptrace (Volatility 3)"
description: "Tasks tracing or traced by another (ptrace): debuggers, or injection and credential theft by attaching to a process. Volatility 3 `linux.ptrace.Ptrace`."
source: "Memory image"
kind: artifact
os: linux
category: memory
requires: ["memory.image"]
# after art_linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["art_linmem_info"]
handler: "artifact_engine.handlers.mem_linux:ptrace"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  linmem_ptrace: ["linmem_ptrace.csv"]
