id: art_linmem_ftrace
name: "Linux memory: ftrace (Volatility 3)"
description: "Ftrace callbacks and the kernel functions they hook: the way modern rootkits hide. Volatility 3 `linux.tracing.ftrace.CheckFtrace` over the unit's Linux memory image."
source: "Memory image"
alert: detect
os: linux
category: memory
requires: ["memory.image"]
# after art_linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["art_linmem_info"]
handler: "artifact_engine.handlers.mem_linux:ftrace"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  linmem_ftrace: ["linmem_ftrace.csv"]
