id: art_linmem_sockstat
name: "Linux memory: sockstat (Volatility 3)"
description: "Every socket of every process: family, protocol, local and remote address and port, state. One row per process, descriptor and socket: each process's file table is read once, not once per thread as Volatility's own plugin does, which took past a quarter of an hour on a busy desktop (the engine's `aeng_linux.Sockstat`; `linux.sockstat.Sockstat` when it cannot run). Volatility 3 over the unit's Linux memory image."
source: "Memory image"
alert: context
os: linux
category: memory
requires: ["memory.image"]
# after art_linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["art_linmem_info"]
handler: "artifact_engine.handlers.mem_linux:sockstat"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  linmem_sockstat: ["linmem_sockstat.csv"]
