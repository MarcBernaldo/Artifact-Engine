id: linmem_process_spoofing
name: "Linux memory: process_spoofing (Volatility 3)"
description: "Processes whose name or command line disagrees with the binary they run, or whose binary was deleted after it started. Volatility 3 `linux.malware.process_spoofing.ProcessSpoofing` over the unit's Linux memory image."
source: "Memory image"
alert: detect
os: linux
category: memory
requires: ["memory.image"]
# after linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["linmem_info"]
handler: "artifact_engine.handlers.mem_linux:process_spoofing"
timeout: 3600
