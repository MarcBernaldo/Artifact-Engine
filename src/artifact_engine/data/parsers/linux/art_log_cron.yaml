id: art_log_cron
name: "Cron execution log (/var/log/cron)"
description: "Cron activity from /var/log/cron and rotations, Debian syslog or the journal: every job execution, crontab change (REPLACE is when persistence was installed; EDIT, DELETE, LIST) and spool reload. Flags jobs run from staging directories. run-parts and anacron noise dropped."
source: "/var/log (syslog/cron); the systemd journal when neither exists"
kind: artifact
os: linux
category: eventlogs
handler: "artifact_engine.handlers.lin_cron_log:run"
requires: ["[root]/var/log"]
provides: [cron_log_csv]
outputs:
  - path: "{out}/art_log_cron.csv"
    format: csv
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  cron_log: ["cron_log.csv"]
