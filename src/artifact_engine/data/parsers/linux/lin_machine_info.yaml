id: machine_info
name: "Machine info"
description: "Host identity (hostname, OS, kernel, IPs, users) -> machine_info.json"
source: "UAC live_response (hostnamectl, os-release, ip)"
alert: context
os: linux
category: systeminfo
requires: ["live_response"]
provides: [machine_info_json, machine_info_csv]
handler: "artifact_engine.handlers.lin_machineinfo:run"
# v0.7.158: renamed from `machineinfo`, so the id is the table it writes
replaces:
  machineinfo: ["machineinfo.csv"]
