id: linmem_lsof
name: "Linux memory: lsof (Volatility 3)"
description: "Open file descriptors of every process: files, devices, pipes and sockets, with their inode times. Volatility 3 `linux.lsof.Lsof` over the unit's Linux memory image."
source: "Memory image"
alert: context
os: linux
category: memory
requires: ["memory.image"]
# after linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["linmem_info"]
handler: "artifact_engine.handlers.mem_linux:lsof"
timeout: 3600
