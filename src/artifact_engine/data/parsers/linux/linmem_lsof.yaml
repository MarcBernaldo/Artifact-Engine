id: linmem_lsof
name: "Linux memory: lsof (Volatility 3)"
description: "Open file descriptors of every process: files, devices, pipes and sockets, with their inode times. One row per process and descriptor: each process's file table is read once, not once per thread as Volatility's own plugin does (the engine's `aeng_linux.Lsof`; `linux.lsof.Lsof` when it cannot run). Volatility 3 over the unit's Linux memory image."
source: "Memory image"
alert: context
os: linux
category: memory
requires: ["memory.image"]
# after linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["linmem_info"]
handler: "artifact_engine.handlers.mem_linux:lsof"
timeout: 3600
