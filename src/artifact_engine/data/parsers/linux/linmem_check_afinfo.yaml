id: linmem_check_afinfo
name: "Linux memory: check_afinfo (Volatility 3)"
description: "Network protocol operation pointers that do not point into the kernel (a rootkit hiding connections). Empty when nothing is hooked. Volatility 3 `linux.malware.check_afinfo.Check_afinfo` over the unit's Linux memory image."
source: "Memory image"
alert: detect
os: linux
category: memory
requires: ["memory.image"]
# after linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["linmem_info"]
handler: "artifact_engine.handlers.mem_linux:check_afinfo"
timeout: 3600
