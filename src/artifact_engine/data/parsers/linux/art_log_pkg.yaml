id: art_log_pkg
name: "Package history"
description: "Software install/remove/upgrade timeline (apt/dpkg/zypp/dnf/yum); flags offensive tooling"
source: "/var/log (apt, dpkg, zypp, dnf)"
alert: flag
os: linux
category: eventlogs
requires: ["[root]/var/log"]
provides: [pkg_history_csv]
handler: "artifact_engine.handlers.lin_pkg_history:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  pkg_history: ["pkg_history.csv"]
