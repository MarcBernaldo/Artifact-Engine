id: art_linmem_pagecache
name: "Linux memory: pagecache (Volatility 3)"
description: "Files with pages in the page cache, by path, with inode times and sizes: what the system recently opened or read, deleted files included. Volatility 3 `linux.pagecache.Files`."
source: "Memory image"
kind: artifact
os: linux
category: memory
requires: ["memory.image"]
# after art_linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["art_linmem_info"]
handler: "artifact_engine.handlers.mem_linux:pagecache"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  linmem_pagecache: ["linmem_pagecache.csv"]
