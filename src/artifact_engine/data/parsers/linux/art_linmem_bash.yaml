id: art_linmem_bash
name: "Linux memory: bash (Volatility 3)"
description: "Bash history recovered from the heap of each running bash, with the time each command was typed -- including commands never written to .bash_history. Volatility 3 `linux.bash.Bash` over the unit's Linux memory image."
source: "Memory image"
alert: context
os: linux
category: memory
requires: ["memory.image"]
# after art_linmem_info, which fetches the kernel's symbols once for the unit
depends_on: ["art_linmem_info"]
handler: "artifact_engine.handlers.mem_linux:bash"
timeout: 3600
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  linmem_bash: ["linmem_bash.csv"]
