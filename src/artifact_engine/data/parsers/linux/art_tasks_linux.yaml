id: art_tasks_linux
name: "Scheduled tasks"
description: "Everything scheduled, one row each: cron (system, cron.d, user spools) with schedule, user and command, anacron, periodic script directories, at jobs, systemd timers with the command they start and next/last run, cron.allow/deny. Flags suspicious commands, LD_* variables and a PATH that reaches a writable directory."
source: "/etc/crontab, cron.d, anacrontab, cron.{hourly,daily,weekly,monthly}, the cron and at spools, systemd timer units, systemctl list-timers"
kind: artifact
os: linux
category: persistence
requires: ["[root]/etc"]
depends_on: ["art_bodyfile", "art_log_cron"]
provides: [tasks_csv]
handler: "artifact_engine.handlers.lin_tasks:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  tasks: ["tasks.csv"]
