id: art_firewall
name: "Firewall, routes and neighbours"
description: "Firewall rules and chain policies (iptables filter and nat, nft), the routing table and the ARP/neighbour cache. Flags DNAT, REDIRECT and TPROXY rules outside the chains container runtimes and Kubernetes write. The neighbour cache shows hosts reached at layer 2 that left no log line."
source: "UAC live_response/network (iptables, nft, ip route, ip neighbor, arp)"
kind: artifact
os: linux
category: network
requires: ["live_response/network"]
provides: [firewall_rules_csv, routes_csv, arp_cache_csv]
handler: "artifact_engine.handlers.lin_firewall:run"
# v0.7.171: tables say their type (art_ / alert_); the old id and its
# tables are retired here.
replaces:
  firewall: ["arp_cache.csv", "firewall_rules.csv", "routes.csv"]
