# The suite is the gate this project actually trusts: `pytest -q` and `ruff check`
# both clean, always. Running it here means a pull request is checked before anyone
# reads it, which matters most for changes this repo did not write by hand.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Windows because that is what the engine targets and where the suite is
    # developed: half the handlers shell out to Windows-only tooling, and paths,
    # console encoding and the registry parsers all behave differently elsewhere.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range. Not redundant: a CPython wording change
        # between these two versions silently disabled the unraisable-hook filter
        # once already, and only a run on both would have caught it.
        python-version: ['3.10', '3.13']

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # Editable, like a real install: the tests import artifact_engine from src/.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src/ tests/

      - name: Test
        # No external tool binaries and no geo assets here -- `aeng setup` fetches
        # those and they are gitignored. Any test needing one must skip, not fail.
        run: python -m pytest -q
