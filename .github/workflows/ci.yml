# The suite is the gate this project actually trusts: `pytest -q` and `ruff check`
# both clean, always. Running it here means a pull request is checked before anyone
# reads it, which matters most for changes this repo did not write by hand.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is where the engine is developed and where it does most of its
        # work: half the handlers shell out to Windows-only tooling, and the
        # registry parsers have no equivalent elsewhere. Both ends of the supported
        # Python range, and not redundant -- a CPython wording change between these
        # two versions silently disabled the unraisable-hook filter once already,
        # and only a run on both would have caught it.
        #
        # Linux is a declared target too (docs/CROSS-PLATFORM.md), and this leg is
        # not a courtesy: it is the only place the suite meets a CASE-SENSITIVE
        # filesystem and a POSIX path flavour. Both matter, and both fail quietly.
        # It found two parsers that read a `$MFT` path with the host's `pathlib`
        # flavour, where off Windows the basename comes back as the whole string --
        # no error, just a table that stops recognising things.
        #
        # What this leg does NOT prove: nothing here runs an external binary (no
        # `aeng setup`, and the tools are gitignored), so it gates the Python half
        # only. Parity of RESULTS across the two hosts is a separate job and only
        # claimable for Linux acquisitions -- see CROSS-PLATFORM.md §0.
        include:
          - {os: windows-latest, python-version: '3.10'}
          - {os: windows-latest, python-version: '3.13'}
          - {os: ubuntu-latest, python-version: '3.13'}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # Editable, like a real install: the tests import artifact_engine from src/.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src/ tests/

      - name: Test
        # No external tool binaries and no geo assets here -- `aeng setup` fetches
        # those and they are gitignored. Any test needing one must skip, not fail.
        run: python -m pytest -q
