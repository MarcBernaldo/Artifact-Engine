# Weekly update proposals for the Python dependencies and the GitHub Actions.
# Every dependency in pyproject.toml carries an upper bound on purpose (see the
# comment there): a new major arrives as a pull request that CI tests, and is
# adopted on purpose, never by whoever installs next.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # mcp 2 renamed FastMCP and changed the server API: adopting it is a port of
      # mcp_server.py, a development of its own (docs/BACKLOG.md, AE-038), not
      # a version bump.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
